# Publishes GlassSphere (index.html, installable on the iOS home screen) to GitHub Pages, with the data files
# (glasssphere-data.json for BTC, glasssphere-<asset>.json for the other assets) refreshed every
# hour, and sends alerts for each of them to ntfy.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
# Alerts: add the repository secret NTFY_TOPIC and subscribe to that topic in the ntfy app (no secret, no alerts).
name: GlassSphere

on:
  push:
    branches: [claude/btc-usdt-chart-dashboard-i92jp1]
  # GitHub runs scheduled workflows late or skips them when busy (here often hours apart): two a hour, and the alerts
  # also run after a push, each reporting what happened since the last run
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test alert'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir -p _site
          cp *.html manifest.webmanifest _site/ && cp -r icons _site/
          # the commit, so an open page or a resumed home-screen app sees a new version and reloads
          sed -i 's/name="glasssphere-build" content="dev"/name="glasssphere-build" content="${{ github.sha }}"/' _site/index.html
          echo "${{ github.sha }}" > _site/build.txt
          # data for index.html, one file per asset; the book history of the live site is carried forward
          # (liquidity-data.json is the BTC file's name before the rename to GlassSphere)
          base="${{ steps.pages.outputs.base_url }}"
          python3 scripts/glasssphere_snapshot.py _site --asset btc --prev "$base/glasssphere-data.json" --prev "$base/liquidity-data.json"
          for a in eth sol bnb xrp doge sui ena pepe wld near hype zec ltc ada uni link; do
            python3 scripts/glasssphere_snapshot.py _site --asset $a --prev "$base/glasssphere-$a.json"
          done
          # every asset's verdict in one small file, for the coin tiles on the start page
          python3 scripts/glasssphere_summary.py _site
          # the Buy / Sell signals as a log with their outcome (the scoreboard), carried forward from the live site
          python3 scripts/glasssphere_signals.py _site --prev "$base/glasssphere-signals.json" || echo "signals skipped"
      - name: Send alerts
        # on every run: what happened since the last one, each event once (glasssphere-alerts.json and the sent marks in
        # glasssphere-signals.json are carried forward, so this runs before the upload)
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # per coin on / off and the quiet hours are in alerts.json
        run: python3 scripts/glasssphere_notify.py _site "${{ steps.pages.outputs.base_url }}" ${{ inputs.test && '--test' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
