<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GlassSphere · Liquiditeitsstad</title>
<meta name="theme-color" content="#05040d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap">
<style>
/* De liquiditeitsstad: the order book as a city at night. The price is an avenue running left (lower) to right (higher);
   every price zone along it is a plot. The front row holds the order book (bid walls green, ask walls red), the middle row
   the estimated stops, the back row the estimated liquidations; the size of each zone is the height of its building, so
   dense liquidity stands as a wall of towers. The live price is a light on the avenue and drags a light trail over the
   square in front (the last four hours, oldest at the bottom). Liquidity that leaves the book, or that the price runs
   through, goes dark: the windows switch off, the building sinks and leaves its outline. The two targets are searchlights.
   Stand-alone like Zee; the data part is copied from zee.html (which copies held.html and index.html). */
:root{
  color-scheme: dark;
  --bg:#05040d; --line2:#262236; --txt:#eef1f8; --dim:#9a97b0; --faint:#5a5674;
  --up:#35ffb4; --dn:#ff4f6d; --stop:#ffc35a; --liq:#ad8bff; --cy:#7fe9ff; --btc:#f7931a;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#city{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;outline:none}
#city.hand{cursor:pointer}
#city.grab{cursor:grabbing}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font:500 12px var(--mono);letter-spacing:.12em;color:var(--dim);padding:24px;pointer-events:none}
#msg[hidden]{display:none}

.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;text-shadow:0 1px 8px #05040d}
.hud .k{font:600 10px var(--mono);letter-spacing:.2em;color:var(--dim);display:flex;align-items:center;gap:7px}
.hud .k i{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffc56b,var(--btc) 60%,#9a5300);box-shadow:0 0 10px rgba(247,147,26,.6)}
.hud .px{font:700 28px var(--mono);letter-spacing:-.02em;margin-top:2px;transition:color .4s}
.hud .px.up{color:var(--up)} .hud .px.dn{color:var(--dn)}
.hud .sub{font:500 11px var(--mono);color:var(--dim);margin-top:1px}
.hud .r{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.goal{font:600 11px var(--mono);border:1px solid var(--c);color:var(--c);border-radius:999px;padding:3px 9px;background:rgba(5,4,13,.6);
  box-shadow:0 0 12px -2px var(--c);white-space:nowrap}
.goal em{font-style:normal;color:var(--txt);margin-left:6px}

.tools{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools a,.tools button{flex:none;font:600 11px var(--mono);color:var(--dim);text-decoration:none;border:1px solid var(--line2);border-radius:6px;padding:6px 10px;
  background:rgba(5,4,13,.74);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tools a:hover,.tools button:hover{color:var(--txt);border-color:#3b3550}
.tools button[aria-pressed=true]{color:var(--txt);border-color:#4a4466}
.tools button[data-layer][aria-pressed=false]{opacity:.45}
.tools .dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:0}

#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 96px);display:flex;flex-direction:column;gap:6px;
  align-items:flex-end;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
#toast div{font:500 11px var(--mono);background:rgba(8,6,20,.86);border:1px solid var(--line2);border-left:3px solid var(--c);border-radius:6px;padding:7px 12px 8px 10px;
  display:flex;flex-direction:column;gap:2px;animation:tin .35s ease-out;transition:opacity .5s,transform .5s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#toast div b{color:var(--c);font-weight:700}
#toast div span{color:var(--dim)}
#toast div.out{opacity:0;transform:translateX(16px)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}}

.panel{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:58px;width:330px;max-height:calc(100vh - 170px);overflow-y:auto;background:rgba(8,6,20,.92);
  border:1px solid var(--line2);border-radius:10px;padding:14px 16px 16px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:12.5px;line-height:1.5}
.panel[hidden]{display:none}
.panel .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--dim);font:500 20px var(--sans);cursor:pointer;padding:2px 6px;line-height:1}
.panel h3{font:700 15px var(--sans);margin:0 26px 8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:500 12px var(--mono)}
.panel dt{color:var(--dim)} .panel dd{text-align:right}
.panel p{color:var(--dim);margin-top:9px}
.panel p b{color:var(--txt);font-weight:600}
.panel ul{list-style:none;display:flex;flex-direction:column;gap:9px;color:var(--dim)}
.panel li b{color:var(--txt);font-weight:600}
.panel li i{font-style:normal;color:var(--c)}
.pill{display:inline-block;font:600 11.5px var(--sans);color:var(--c);border:1.5px solid var(--c);border-radius:999px;padding:2px 10px;
  box-shadow:0 0 10px -3px var(--c),inset 0 0 8px -4px var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 50%,transparent);white-space:nowrap}

#side{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 96px);bottom:58px;width:400px;background:rgba(8,6,20,.92);
  border:1px solid var(--line2);border-radius:10px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;overflow:hidden}
#side[hidden]{display:none}
#side .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--dim);font:500 20px var(--sans);cursor:pointer;padding:2px 6px;line-height:1;z-index:2}
#side .hd,#lad li{display:grid;grid-template-columns:72px 66px 1fr auto;gap:8px;align-items:center;padding:0 14px}
#side .hd{font:600 10px var(--mono);letter-spacing:.16em;color:var(--faint);height:34px;border-bottom:1px solid var(--line2);padding-right:40px}
#lad{list-style:none;overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#262236 transparent}
#lad li{height:38px;border-bottom:1px solid rgba(38,34,54,.6);font:500 12.5px var(--mono);cursor:pointer}
#lad li:hover{background:rgba(255,255,255,.03)}
#lad li .g{text-align:right}
#lad li.near{background:rgba(255,79,109,.12)}
#lad li.now{height:46px;background:rgba(127,233,255,.06);border-top:1px solid rgba(127,233,255,.25);border-bottom:1px solid rgba(127,233,255,.25);cursor:default}
#lad li.now b{font:700 16px var(--mono);color:var(--cy)}
#lad li.now .pill{--c:#dfe6f0;font-weight:700;letter-spacing:.06em}
#lad li.out{opacity:.45}
#lad li.out .g:after{content:' · weg';color:var(--faint)}

@media (max-width:639px){
  .hud .px{font-size:24px}
  #hg{display:none}
  .panel{left:12px;right:12px;width:auto;bottom:54px;max-height:52vh}
  #side{left:12px;right:12px;width:auto;top:auto;bottom:54px;height:min(62vh,560px)}
  #side .hd,#lad li{grid-template-columns:62px 60px 1fr auto;gap:6px;padding:0 10px}
  #side .hd{padding-right:34px}
  #toast{top:auto;bottom:58px;left:12px;right:12px;max-width:none;align-items:stretch}
  .long{display:none}
}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}
</style>
</head>
<body>
<canvas id="city" tabindex="0" aria-label="Het orderboek van BTC als stad: de avenue is de prijs, de voorste rij gebouwen het orderboek (koopmuren groen, verkoopmuren rood), de middelste rij de geschatte stops, de achterste rij de geschatte liquidaties. Hoe groter de liquiditeit, hoe hoger het gebouw. Het lichtspoor is de koers van de laatste vier uur. Tik op een gebouw voor details; slepen schuift, knijpen of scrollen zoomt."></canvas>
<div class="hud">
  <div>
    <div class="k"><i></i>BTC<span class="long"> · LIQUIDITEITSSTAD</span></div>
    <div class="px" id="hp">—</div>
    <div class="sub" id="hs">&nbsp;</div>
  </div>
  <div class="r" id="hg"></div>
</div>
<div id="msg">STAD BOUWEN…</div>
<div id="toast" aria-live="polite"></div>
<div class="panel" id="card" hidden role="dialog"></div>
<aside id="side" hidden aria-label="Alle niveaus">
  <button class="x" type="button" aria-label="Sluiten">×</button>
  <div class="hd"><span>PRIJS</span><span>AFSTAND</span><span>SOORT</span><span>GROOTTE</span></div>
  <ol id="lad"></ol>
</aside>
<div class="tools">
  <a href="./#btc">← <span class="long">GlassSphere</span></a>
  <button id="follow" type="button" aria-pressed="true" title="De prijs volgen (0)">⌖ Volg</button>
  <button id="sideb" type="button" aria-pressed="false">☰ Niveaus</button>
  <button type="button" data-layer="wall" aria-pressed="true"><span class="dot" style="background:linear-gradient(90deg,var(--up) 50%,var(--dn) 50%)"></span>Muren</button>
  <button type="button" data-layer="stop" aria-pressed="true"><span class="dot" style="background:var(--stop)"></span>Stops</button>
  <button type="button" data-layer="liq" aria-pressed="true"><span class="dot" style="background:var(--liq)"></span>Liquidaties</button>
  <button type="button" data-layer="goal" aria-pressed="true"><span class="dot" style="background:#fff"></span>Doelen</button>
  <button type="button" data-layer="trail" aria-pressed="true"><span class="dot" style="background:var(--cy)"></span>Spoor</button>
  <button id="help" type="button" aria-pressed="false">? Uitleg</button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const msg = t => { $('msg').hidden = !t; if (t) $('msg').textContent = t; };

/* =====================================================================================================================
   DATA: copied from held.html, which copies index.html (asset, fetching, estimates, levels and targets), BTC only for now
   ===================================================================================================================== */
const A = { name: 'BTC', file: 'glasssphere-data.json', okx: 'BTC-USDT-SWAP', okxCt: 0.01, usdt: 'BTCUSDT', gate: 'BTC_USDT', gateMul: 1e-4, gateIv: '10',
  htx: 'BTC-USDT', htxCt: 0.001, deribit: 'BTC-PERPETUAL', deribitUsd: true, bitmex: 'XBTUSD', cdc: 'BTCUSD-PERP', hl: 'BTC', hlSig: 3, dydx: 'BTC-USD',
  bin: 10, histBin: 100, buckets: [25, 50, 100, 250, 500], auto: { 0.015: 50, 0.03: 100, 0.06: 250, 0.12: 500 }, dec: 0 };
const digits = step => Math.max(0, -Math.floor(Math.log10(step))) + 3;
const nice = x => { const m = 10 ** Math.floor(Math.log10(x));
  return [1, 2, 2.5, 5, 10].map(c => c * m).reduce((a, b) => Math.abs(Math.log(x / b)) < Math.abs(Math.log(x / a)) ? b : a); };
const LEV = [[5, .30], [10, .35], [25, .25], [50, .10]];
const MAINT = 0.004, HALF_LIFE_H = 168, HZ_MIN = 0.3, HORIZON = 3;
const fx = (x, d) => x.toFixed(d).replace('.', ',');
const fmtP = p => p.toLocaleString('nl-NL', { minimumFractionDigits: A.dec, maximumFractionDigits: A.dec });
const fmtUsd = v => v >= 1e9 ? '$' + fx(v / 1e9, 2) + ' mld' : v >= 1e6 ? '$' + fx(v / 1e6, 1) + ' mln' : v >= 1e3 ? '$' + fx(v / 1e3, 0) + 'K' : '$' + fx(v, 0);
const pct = (p, ref) => { const v = (p / ref - 1) * 100; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ',') + '%'; };

async function getJSON(url, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { ...opts, signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const hlPost = body => getJSON('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
function binLevels(rows, side) {
  const m = {}, B = A.bin;
  for (const [p, usd] of rows) {
    if (!(usd > 0)) continue;
    const k = +((side === 'b' ? Math.floor(p / B + 1e-9) : Math.ceil(p / B - 1e-9)) * B).toFixed(digits(B));
    m[k] = (m[k] || 0) + usd;
  }
  return Object.entries(m).map(([k, v]) => [+k, Math.round(v)]);
}
const BOOKS = {
  okx: async () => { const b = (await getJSON(`https://www.okx.com/api/v5/market/books-full?instId=${A.okx}&sz=5000`)).data[0];
    const f = r => [+r[0], +r[1] * A.okxCt * +r[0]]; return { b: b.bids.map(f), a: b.asks.map(f) }; },
  binance: async () => { const j = await getJSON(`https://fapi.binance.com/fapi/v1/depth?symbol=${A.usdt}&limit=1000`);
    const f = r => [+r[0], +r[1] * +r[0]]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  deribit: async () => { const j = (await getJSON(`https://www.deribit.com/api/v2/public/get_order_book?instrument_name=${A.deribit}&depth=10000`)).result;
    const f = A.deribitUsd ? r => r : r => [r[0], r[1] * r[0]]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  gate: async () => { const j = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/order_book?contract=${A.gate}&limit=300&interval=${A.gateIv}`);
    const f = r => [+r.p, r.s * A.gateMul * +r.p]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  hyperliquid: async () => { const j = await hlPost({ type: 'l2Book', coin: A.hl, nSigFigs: A.hlSig });
    const f = r => [+r.px, +r.sz * +r.px]; return { b: j.levels[0].map(f), a: j.levels[1].map(f) }; },
  bybit: async () => { const r = (await getJSON(`https://api.bybit.com/v5/market/orderbook?category=linear&symbol=${A.usdt}&limit=500`)).result;
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: r.b.map(f), a: r.a.map(f) }; },
  bitget: async () => { const d = (await getJSON(`https://api.bitget.com/api/v2/mix/market/merge-depth?productType=usdt-futures&symbol=${A.usdt}&limit=max&precision=scale2`)).data;
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: d.bids.map(f), a: d.asks.map(f) }; },
  htx: async () => { const t = (await getJSON(`https://api.hbdm.com/linear-swap-ex/market/depth?contract_code=${A.htx}&type=step0`)).tick;
    const f = x => [x[0], x[1] * A.htxCt * x[0]]; return { b: t.bids.map(f), a: t.asks.map(f) }; },
  bitmex: async () => { const j = await getJSON(`https://www.bitmex.com/api/v1/orderBook/L2?symbol=${A.bitmex}&depth=0`);
    const f = x => [x.price, x.size]; return { b: j.filter(x => x.side === 'Buy').map(f), a: j.filter(x => x.side === 'Sell').map(f) }; },
  cryptocom: async () => { const d = (await getJSON(`https://api.crypto.com/exchange/v1/public/get-book?instrument_name=${A.cdc}&depth=150`)).result.data[0];
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: d.bids.map(f), a: d.asks.map(f) }; },
  dydx: async () => { const j = await getJSON(`https://indexer.dydx.trade/v4/orderbooks/perpetualMarket/${A.dydx}`);
    const f = x => [+x.price, +x.size * +x.price]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
};
const MARKET = {
  okx: async () => { const [o, t] = await Promise.all([getJSON(`https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=${A.okx}`),
      getJSON(`https://www.okx.com/api/v5/market/ticker?instId=${A.okx}`)]);
    return { oi: +o.data[0].oiUsd, vol: +t.data[0].volCcy24h * +t.data[0].last }; },
  gate: async () => { const [t] = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/tickers?contract=${A.gate}`);
    return { oi: +t.total_size * A.gateMul * +t.mark_price, vol: +t.volume_24h_quote }; },
  bitget: async () => { const t = (await getJSON(`https://api.bitget.com/api/v2/mix/market/ticker?symbol=${A.usdt}&productType=usdt-futures`)).data[0];
    return { oi: +t.holdingAmount * +t.lastPr, vol: +t.usdtVolume }; },
  htx: async () => ({ vol: +(await getJSON(`https://api.hbdm.com/linear-swap-ex/market/detail/merged?contract_code=${A.htx}`)).tick.trade_turnover }),
  deribit: async () => { const r = (await getJSON(`https://www.deribit.com/api/v2/public/get_book_summary_by_instrument?instrument_name=${A.deribit}`)).result[0];
    return { oi: A.deribitUsd ? r.open_interest : r.open_interest * r.mark_price, vol: r.volume_usd }; },
  cryptocom: async () => { const t = (await getJSON(`https://api.crypto.com/exchange/v1/public/get-tickers?instrument_name=${A.cdc}`)).result.data[0];
    return { oi: +t.oi * +t.a, vol: +t.vv }; },
  hyperliquid: async () => { const [m, c] = await hlPost({ type: 'metaAndAssetCtxs' });
    const x = c[m.universe.findIndex(u => u.name === A.hl)]; return { oi: +x.openInterest * +x.markPx, vol: +x.dayNtlVlm }; },
  dydx: async () => { const x = (await getJSON(`https://indexer.dydx.trade/v4/perpetualMarkets?ticker=${A.dydx}`)).markets[A.dydx];
    return { oi: +x.openInterest * +x.oraclePrice, vol: +x.volume24H }; },
  binance: async () => { const [o, t, f] = await Promise.all([getJSON(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${A.usdt}`),
      getJSON(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${A.usdt}`), getJSON(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${A.usdt}`)]);
    return { oi: +o.openInterest * +f.markPrice, vol: +t.quoteVolume }; },
  bybit: async () => { const t = (await getJSON(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${A.usdt}`)).result.list[0];
    return { oi: +t.openInterestValue, vol: +t.turnover24h }; },
  bitmex: async () => { const [x] = await getJSON(`https://www.bitmex.com/api/v1/instrument?symbol=${A.bitmex}`); return { oi: x.openInterest, vol: x.foreignNotional24h || 0 }; },
};
async function fetchAll(table, wrap) {
  const out = {};
  await Promise.all(Object.entries(table).map(async ([k, fn]) => { try { out[k] = wrap(await fn(), k); } catch (e) {} }));
  return out;
}
const fetchBooks = () => fetchAll(BOOKS, r => ({ b: binLevels(r.b, 'b'), a: binLevels(r.a, 'a') }));
const fetchMarket = () => fetchAll(MARKET, r => r);
async function fetchSeries() {
  const base = 'https://www.okx.com/api/v5/market/', toC = r => [+r[0], +r[1], +r[2], +r[3], +r[4], +r[7]];
  const rows = (await getJSON(base + `candles?instId=${A.okx}&bar=1H&limit=300`)).data;
  try { rows.push(...(await getJSON(base + `history-candles?instId=${A.okx}&bar=1H&limit=100&after=${rows[rows.length - 1][0]}`)).data); } catch (e) {}
  const candles = rows.map(toC).sort((a, b) => a[0] - b[0]).slice(-400);
  const st = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=${A.gate}&interval=1h&from=${candles[0][0] / 1000}&limit=1000`);
  return { candles, oi: st.map(r => [r.time * 1000, Math.round(r.open_interest_usd)]), taker: st.map(r => [r.time * 1000, r.lsr_taker / (1 + r.lsr_taker)]) };
}
// Stops: just beyond swing highs / lows that price has not traded through since.
function estimateStops(candles, price, lo, hi) {
  const out = [], n = candles.length, now = candles[n - 1][0];
  const sufHi = new Float64Array(n + 1).fill(-Infinity), sufLo = new Float64Array(n + 1).fill(Infinity);
  for (let i = n - 1; i >= 0; i--) { sufHi[i] = Math.max(sufHi[i + 1], candles[i][2]); sufLo[i] = Math.min(sufLo[i + 1], candles[i][3]); }
  for (const [L, mult] of [[4, 1], [12, 2]]) {
    for (let i = L; i < n - L; i++) {

  SEL = b ? { b, p: b.p } : { b: null, p: priceAt(x) };
  openCard('sel');
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x0: e.clientX, y0: e.clientY, c: V.c, moved: false };
  else if (ptrs.size === 2 && D) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.max(20, Math.abs(a.x - b.x)), r: V.r, mid: (a.x + b.x) / 2 }; pinch.p = priceAt(pinch.mid); if (drag) drag.moved = true; }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' && !ptrs.size) { HOVB = pick(e.clientX, e.clientY); cv.classList.toggle('hand', !!HOVB); }
  if (!ptrs.has(e.pointerId) || !D) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()], d = Math.max(20, Math.abs(a.x - b.x)), mid = (a.x + b.x) / 2;
    V.r = clamp(pinch.r * pinch.d / d, rMin(), rMax()); V.c = pinch.p - (mid - W / 2) / sAt(AVE.zc) / HW * V.r; V.anim = null; V.zt = T; setFollow(false); return; }
  if (drag) { const dx = e.clientX - drag.x0; if (!drag.moved && Math.hypot(dx, e.clientY - drag.y0) > 7) { drag.moved = true; cv.classList.add('grab'); setFollow(false); V.anim = null; }
    if (drag.moved) V.c = drag.c - dx / sAt(AVE.zc) / HW * V.r; }
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { if (drag && !drag.moved && D) tap(e.clientX, e.clientY); drag = null; cv.classList.remove('grab'); }
  else if (drag) { const [p] = [...ptrs.values()]; drag = { x0: p.x, y0: p.y, c: V.c, moved: true }; }
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; drag = null; });
cv.addEventListener('pointerleave', () => { HOVB = null; });
cv.addEventListener('wheel', e => { if (!D) return; e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { V.c += e.deltaX / sAt(AVE.zc) / HW * V.r; setFollow(false); V.anim = null; }
  else zoomAt(V.r * Math.exp(e.deltaY * .0015), e.clientX); }, { passive: false });
cv.addEventListener('keydown', e => {
  if (!D) return; const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight') { V.c += (k === 'ArrowLeft' ? -1 : 1) * V.r * .15; setFollow(false); V.anim = null; }
  else if (k === '+' || k === '=') zoomAt(V.r / 1.25, W / 2); else if (k === '-' || k === '_') zoomAt(V.r * 1.25, W / 2);
  else if (k === '0') home(); else if (k === 'Escape') { closeCard(); setSide(false); }
  else return;
  e.preventDefault();
});

  else setInterval(loadLive, 30e3);

})();
window.STAD = { get D() { return D; }, get LV() { return LV; }, get TG() { return TG; }, V, CITY: () => CITY, realLiq, onPrice, cross, live, dim, build, get CB() { return CB; } };
