<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GlassSphere · Tetris</title>
<meta name="theme-color" content="#060908">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tetris">
<meta name="application-name" content="GlassSphere Tetris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen app — ticker strip, full-bleed 3D well of order-book levels, control strip */
:root{
  --bg:#060908; --panel:#0d1311; --line:#1d2723; --txt:#eef4f0; --dim:#7c8f87; --faint:#4a5852;
  --up:#35ffb0; --dn:#ff4d6a; --stop:#ffc857; --liq:#b48cff; --now:#7ff0d0;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --pix:"Press Start 2P","JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0;font-size:14px}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
.app{height:100%;display:flex;flex-direction:column}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud{padding-block:10px 8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0b110f,var(--bg))}
.tick{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.coin{width:18px;height:18px;border-radius:50%;align-self:center}
#coin{font:inherit;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--txt);background:#141020;border:1px solid #2a2540;border-radius:8px;padding:3px 22px 3px 8px;align-self:center;-webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#8f87b0 50%),linear-gradient(135deg,#8f87b0 50%,transparent 50%);background-position:right 10px center,right 6px center;background-size:4px 4px;background-repeat:no-repeat}
#coin:focus-visible{outline:2px solid var(--now);outline-offset:2px}
#px{font-family:var(--mono);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;transition:color .25s,text-shadow .25s}
#px.u{color:var(--up);text-shadow:0 0 14px #35ffb066}
#px.d{color:var(--dn);text-shadow:0 0 14px #ff4d6a66}
#chg{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(5,auto);gap:4px 16px;cursor:pointer;border-radius:8px}
.stats:focus-visible{outline:2px solid var(--now);outline-offset:3px}
.stats .lg b{color:var(--dim)}
.stats em{font-style:normal}
.stats div{display:flex;flex-direction:column;align-items:flex-end}
.stats span{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.stats b{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.main{flex:1;min-height:0;display:flex}
.stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
#snd{margin-left:8px;align-self:center;display:inline-grid;place-items:center;width:30px;height:26px;border-radius:8px;border:1px solid #2a2540;background:#141020;color:var(--dim);cursor:pointer;padding:0}
#snd .w{display:none} #snd[aria-pressed="true"]{color:var(--now);border-color:#3c5f56} #snd[aria-pressed="true"] .w{display:inline} #snd[aria-pressed="true"] .x{display:none}
#snd:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.log{position:absolute;z-index:4;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));max-height:72%;display:flex;flex-direction:column;
  background:#0b0914f4;border:1px solid #2a2540;border-radius:12px;box-shadow:0 12px 40px #000c;touch-action:pan-y;cursor:auto}
.log .lh{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:13px}
.log .lh span{font-size:11px;color:var(--faint)}
.log .lh button{margin-left:auto;font:inherit;font-size:20px;line-height:1;color:var(--dim);background:none;border:0;cursor:pointer;padding:0 4px}
.log ol{list-style:none;margin:0;padding:6px 12px 10px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:11px;line-height:1.4}
.log li{border-left:3px solid var(--fc);padding-left:8px;color:var(--txt)} .log li b{color:var(--fc)} .log time{color:var(--faint);margin-right:6px}
.log .none{color:var(--faint);border:0}
.side{display:none}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:14px;width:340px;flex:none;border-left:1px solid var(--line);background:#09070f;overflow:auto;padding-block:12px;padding-inline:16px;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
  .side h3{margin:0 0 6px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .side table{width:100%;border-collapse:collapse}
  .side td{padding:3px 0;white-space:nowrap} .side td.r{text-align:right} .side td.d{color:var(--dim);padding-left:8px}
  .side tr.now td{color:var(--now);font-weight:700;border-block:1px solid #2a3c38}
  .side .pill{display:inline-block;font-family:var(--sans);font-size:10.5px;font-weight:600;padding:0 7px;border-radius:20px;border:1px solid}
  .side .ex{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:8px;padding:2px 0}
  .side .ex i{height:5px;border-radius:3px}
  .side .tg{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
}
.stage:active{cursor:grabbing}
#c{display:block;width:100%;height:100%}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0;padding-inline:16px}
.banner .big{font-family:var(--pix);font-size:clamp(20px,7vw,46px);color:var(--bc,#fff);letter-spacing:.04em;
  text-shadow:0 0 10px var(--bc,#fff),0 0 34px var(--bc,#fff),4px 4px 0 #000}
.banner .sub{margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--txt);text-shadow:0 1px 3px #000}
.banner .cmb{margin-top:8px;font-family:var(--pix);font-size:11px;color:var(--stop);text-shadow:0 0 10px #ffc85799}
.banner.small{top:30%}
.banner.small .big{font-size:clamp(13px,4vw,19px)}
.banner.go{animation:ban 1.7s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes ban{0%{opacity:0;transform:scale(2.4)}10%{opacity:1;transform:scale(.9)}18%{transform:scale(1.06)}26%{transform:scale(1)}72%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
.next{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:10px;display:flex;align-items:center;gap:9px;
  background:#0d1311cc;border:1px solid var(--line);border-radius:10px;padding:7px 10px;pointer-events:none;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.next .lab{font-family:var(--pix);font-size:8px;color:var(--faint);letter-spacing:.08em}
.mini{display:grid;grid-template-columns:repeat(4,8px);grid-template-rows:repeat(2,8px);gap:2px}
.mini i{border-radius:1px;background:transparent}
.mini i.on{background:var(--mc);box-shadow:0 0 6px var(--mc),inset -2px -2px 0 #0006,inset 2px 2px 0 #fff6}
.next .who{font-family:var(--mono);font-size:11px;color:var(--txt);white-space:nowrap}
.feed{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;
  width:min(250px,52vw);pointer-events:none}
.feed li{font-family:var(--mono);font-size:10.5px;line-height:1.35;background:#0d1311d9;border:1px solid var(--line);border-left:3px solid var(--fc);
  border-radius:6px;padding:5px 8px;color:var(--txt);animation:fin .35s ease-out,fout .6s ease-in 5.4s forwards}
.feed li b{color:var(--fc);font-weight:700}
@keyframes fin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fout{to{opacity:0;transform:translateX(12px)}}
.tip{position:absolute;z-index:3;min-width:200px;width:min(300px,86vw);background:#0d1311f0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;box-shadow:0 10px 30px #000a;pointer-events:none}
.tip h4{margin:0 0 6px;font-family:var(--sans);font-size:13px;color:var(--tc)}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--dim)}
.tip .r b{color:var(--txt);font-weight:600;text-align:right}
.tip p{margin:8px 0 0;font-family:var(--sans);font-size:11.5px;line-height:1.45;color:#b9c6c0}
.tip .parts{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.tip .pt{display:grid;grid-template-columns:74px 1fr auto;align-items:center;gap:7px}
.tip .pt span{font-weight:700}
.tip .pt i{height:5px;border-radius:3px;opacity:.85}
.tip .more{color:var(--faint)}
.note{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:8px;margin:0;font-family:var(--mono);font-size:10px;color:var(--faint);pointer-events:none}
.st{display:inline-flex;align-items:center;gap:6px;margin-left:auto;align-self:center;font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.st.live i{background:var(--up);box-shadow:0 0 8px var(--up);animation:blink 1.6s ease-in-out infinite}
.st.site i{background:var(--stop)}
.st.demo i{background:var(--liq)}
@keyframes blink{50%{opacity:.35}}
@media (max-width:520px){
  .stats{grid-template-columns:repeat(4,1fr) auto;width:100%}
  .stats em.lng{display:none}
  .stats em{font-style:normal}
  #px{font-size:20px} #chg{font-size:11px} .tick{gap:8px} #coin{padding:3px 20px 3px 7px;font-size:12px}
  .stats div{align-items:flex-start}
  .feed{top:auto;bottom:26px;left:max(12px,env(safe-area-inset-left,0px));width:auto}
  .feed li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
  .feed li:nth-child(n+3){display:none}
  .note{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){.st.live i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hud band">
    <div class="tick"><img class="coin" id="coin-ico" src="icons/coins/btc.png" alt=""><select id="coin" aria-label="Munt"><option value="btc">BTC</option><option value="eth">ETH</option><option value="sol">SOL</option><option value="xrp">XRP</option><option value="doge">DOGE</option><option value="sui">SUI</option></select><b id="px">—</b><span id="chg"></span><span class="st" id="st" title="laatste update"><i></i><span id="st-t">laden…</span></span><button id="snd" type="button" aria-pressed="false" aria-label="Geluid aan of uit" title="Geluid"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="w" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="x" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="stats" id="stats" role="button" tabindex="0" aria-label="Logboek openen" title="Logboek">
      <div><span>Geveegd</span><b id="s-clr">0</b></div>
      <div><span>Opgegeten</span><b id="s-eat">$0</b></div>
      <div><span><em class="lng">Echte </em>liq.</span><b id="s-liq">$0</b></div>
      <div><span>Combo</span><b id="s-cmb">×0</b></div>
      <div class="lg"><span>Log<em class="lng">boek</em></span><b>≡</b></div>
    </div>
  </header>
  <div class="main">
  <main class="stage" id="stage">
    <canvas id="c" aria-label="3D orderboek: muren, stops, liquidaties en doelen als Tetris-balken rond de huidige prijs"></canvas>
    <div class="next" aria-hidden="true"><span class="lab">VOLGENDE</span><div class="mini" id="mini"></div><span class="who" id="who">—</span></div>
    <ul class="feed" id="feed" aria-live="polite"></ul>
    <div class="banner" id="banner" aria-hidden="true"></div>
    <div class="tip" id="tip" hidden></div>
    <p class="note" id="note">laden…</p>
    <div class="log" id="log" hidden><div class="lh"><b>Logboek</b><span>nieuwste boven</span><button id="log-x" type="button" aria-label="Logboek sluiten">×</button></div><ol id="log-l"></ol></div>
  </main>
  <aside class="side" id="side" aria-label="Niveaus, doelen en beurzen"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function () {
const $ = id => document.getElementById(id);
const stage = $('stage'), cvs = $('c');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
try {
  await Promise.race([Promise.all([document.fonts.load('700 32px "JetBrains Mono"'), document.fonts.load('600 25px Inter'), document.fonts.load('16px "Press Start 2P"')]),
    new Promise(r => setTimeout(r, 1800))]);
} catch (e) {}

/* ---------- data: the same sources and estimates as index.html (BTC) ---------- */
const ASSETS = {
  btc: { name: 'BTC', file: 'glasssphere-data.json', okx: 'BTC-USDT-SWAP', okxCt: 0.01, usdt: 'BTCUSDT', gate: 'BTC_USDT', gateMul: 1e-4, gateIv: '10',
    htx: 'BTC-USDT', htxCt: 0.001, deribit: 'BTC-PERPETUAL', deribitUsd: true, bitmex: 'XBTUSD', cdc: 'BTCUSD-PERP', hl: 'BTC', hlSig: 3, dydx: 'BTC-USD',
    bin: 10, histBin: 100, auto: { 0.015: 50, 0.03: 100, 0.06: 250, 0.12: 500 }, dec: 0 },
  eth: { name: 'ETH', file: 'glasssphere-eth.json', okx: 'ETH-USDT-SWAP', okxCt: 0.1, usdt: 'ETHUSDT', gate: 'ETH_USDT', gateMul: 0.01, gateIv: '1',
    htx: 'ETH-USDT', htxCt: 0.01, deribit: 'ETH-PERPETUAL', deribitUsd: true, bitmex: null, cdc: 'ETHUSD-PERP', hl: 'ETH', hlSig: 4, dydx: 'ETH-USD',
    bin: 0.25, histBin: 2.5, auto: { 0.015: 1, 0.03: 2.5, 0.06: 5, 0.12: 10 }, dec: 1 },
  sol: { name: 'SOL', file: 'glasssphere-sol.json', okx: 'SOL-USDT-SWAP', okxCt: 1, usdt: 'SOLUSDT', gate: 'SOL_USDT', gateMul: 1, gateIv: '0.1',
    htx: 'SOL-USDT', htxCt: 1, deribit: 'SOL_USDC-PERPETUAL', deribitUsd: false, bitmex: null, cdc: 'SOLUSD-PERP', hl: 'SOL', hlSig: 4, dydx: 'SOL-USD',
    bin: 0.01, histBin: 0.1, auto: { 0.015: 0.05, 0.03: 0.1, 0.06: 0.25, 0.12: 0.5 }, dec: 2 },
  xrp: { name: 'XRP', file: 'glasssphere-xrp.json', okx: 'XRP-USDT-SWAP', okxCt: 100, usdt: 'XRPUSDT', gate: 'XRP_USDT', gateMul: 10, gateIv: '0.001',
    htx: 'XRP-USDT', htxCt: 10, deribit: 'XRP_USDC-PERPETUAL', deribitUsd: false, bitmex: null, cdc: 'XRPUSD-PERP', hl: 'XRP', hlSig: 4, dydx: 'XRP-USD', bitgetSc: 'scale1',
    bin: 0.0001, histBin: 0.002, auto: { 0.015: 0.001, 0.03: 0.002, 0.06: 0.005, 0.12: 0.01 }, dec: 4 },
  doge: { name: 'DOGE', file: 'glasssphere-doge.json', okx: 'DOGE-USDT-SWAP', okxCt: 1000, usdt: 'DOGEUSDT', gate: 'DOGE_USDT', gateMul: 10, gateIv: '0.0001',
    htx: 'DOGE-USDT', htxCt: 100, deribit: 'DOGE_USDC-PERPETUAL', deribitUsd: false, bitmex: null, cdc: 'DOGEUSD-PERP', hl: 'DOGE', hlSig: 3, dydx: 'DOGE-USD', bitgetSc: 'scale1',
    bin: 0.00001, histBin: 0.0001, auto: { 0.015: 0.00005, 0.03: 0.0001, 0.06: 0.00025, 0.12: 0.0005 }, dec: 5 },
  sui: { name: 'SUI', file: 'glasssphere-sui.json', okx: 'SUI-USDT-SWAP', okxCt: 1, usdt: 'SUIUSDT', gate: 'SUI_USDT', gateMul: 1, gateIv: '0.001',
    htx: 'SUI-USDT', htxCt: 1, deribit: 'SUI_USDC-PERPETUAL', deribitUsd: false, bitmex: null, cdc: 'SUIUSD-PERP', hl: 'SUI', hlSig: 3, dydx: 'SUI-USD', bitgetSc: 'scale1',
    bin: 0.0001, histBin: 0.001, auto: { 0.015: 0.0005, 0.03: 0.001, 0.06: 0.0025, 0.12: 0.005 }, dec: 4 },
};
let coinKey = (() => { const h = location.hash.slice(1); if (ASSETS[h]) return h; try { const k = localStorage.getItem('tetris-coin'); if (ASSETS[k]) return k; } catch (e) {} return 'btc'; })();
let A = ASSETS[coinKey];
const digits = step => Math.max(0, -Math.floor(Math.log10(step))) + 3;
const nice = x => { const m = 10 ** Math.floor(Math.log10(x));
  return [1, 2, 2.5, 5, 10].map(c => c * m).reduce((a, b) => Math.abs(Math.log(x / b)) < Math.abs(Math.log(x / a)) ? b : a); };
const LEV = [[5, .30], [10, .35], [25, .25], [50, .10]];
const MAINT = 0.004, HALF_LIFE_H = 168, HZ_MIN = 0.3, READ_RANGE = 0.15;
async function getJSON(url, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { ...opts, signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const hlPost = body => getJSON('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
function binLevels(rows, side) {
  const m = {}, B = A.bin;
  for (const [p, usd] of rows) {
    if (!(usd > 0)) continue;
    const k = +((side === 'b' ? Math.floor(p / B + 1e-9) : Math.ceil(p / B - 1e-9)) * B).toFixed(digits(B));
    m[k] = (m[k] || 0) + usd;
  }
  return Object.entries(m).map(([k, v]) => [+k, Math.round(v)]);
}
const BOOKS = {
  okx: async () => { const b = (await getJSON(`https://www.okx.com/api/v5/market/books-full?instId=${A.okx}&sz=5000`)).data[0];
    const f = r => [+r[0], +r[1] * A.okxCt * +r[0]]; return { b: b.bids.map(f), a: b.asks.map(f) }; },
  binance: async () => { const j = await getJSON(`https://fapi.binance.com/fapi/v1/depth?symbol=${A.usdt}&limit=1000`);
    const f = r => [+r[0], +r[1] * +r[0]]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  deribit: async () => { const j = (await getJSON(`https://www.deribit.com/api/v2/public/get_order_book?instrument_name=${A.deribit}&depth=10000`)).result;
    const f = A.deribitUsd ? r => r : r => [r[0], r[1] * r[0]]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  gate: async () => { const j = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/order_book?contract=${A.gate}&limit=300&interval=${A.gateIv}`);
    const f = r => [+r.p, r.s * A.gateMul * +r.p]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  hyperliquid: async () => { const j = await hlPost({ type: 'l2Book', coin: A.hl, nSigFigs: A.hlSig });
    const f = r => [+r.px, +r.sz * +r.px]; return { b: j.levels[0].map(f), a: j.levels[1].map(f) }; },
  bybit: async () => { const r = (await getJSON(`https://api.bybit.com/v5/market/orderbook?category=linear&symbol=${A.usdt}&limit=500`)).result;

  for (let i = rows.length - 1; i >= 0; i--) { const r = rows[i]; if (r.gone && (r.goneT -= dt) <= 0) { disposeRow(r); rows.splice(i, 1); } }

  // trades: a spray from the price for each one, a block shot into the nearest wall for a big one
  let budget = 40;
  for (const tr of trades.splice(0)) {
    if (Math.random() < Math.min(1, tr.usd / 40e3)) netPulse(tr.buy ? BUYC : SELLC, tr.usd >= 250e3 ? 3 : 1);
    nTrades++;
    const col = tr.buy ? BUYC : SELLC, n = Math.min(6, Math.max(1, Math.ceil(Math.log10(tr.usd / 2e3))));
    if (budget > 0) { emit(rnd(-6, 13), sy, 0.8, col, n, 1.5, { vy: tr.buy ? 5 : -5, life: 0.7, sx: 0.4 }); budget -= n; }
    if (tr.usd >= 250e3) {
      const side = liveRows().filter(r => (tr.buy ? r.type === 'ask' : r.type === 'bid') && !r.cleared && r.units);
      const tgt = side.sort((a, b) => Math.abs(a.yd - sy) - Math.abs(b.yd - sy))[0];
      const x = rnd(0.5, 9.5), dir = tr.buy ? 1 : -1, end = tgt ? barPt(tgt, x) : new THREE.Vector3(x, sy + dir * 4, 0.35);
      bolt(regPos('okx'), end, col, 0, 0.32, () => { if (tgt && !tgt.gone) { tgt.hl = Math.max(tgt.hl, 0.7); tgt.pulse = Math.min(1.5, tgt.pulse + 0.35); } });
      REGS.okx.open = Math.max(REGS.okx.open, 0.6);
      if (tr.usd >= 1e6) floatText(b.sx, sy + (tr.buy ? 1 : -1), (tr.buy ? 'koop ' : 'verkoop ') + fmtUsd(tr.usd), tr.buy ? '#35ffb0' : '#ff4d6a');
      if (tr.usd >= 3e6) feed(`<b>${tr.buy ? 'Grote koop' : 'Grote verkoop'}</b> ${fmtUsd(tr.usd)} op ${fmtP(tr.px)}`, tr.buy ? TY.bid.c : TY.ask.c);

  // pieces: grid steps down the front of the well, then slot into the bar end

    if (q.phase === 'travel') {

      q.blocks.forEach((b, j) => { const [dx, dy] = q.cells[j], sx = q.a.x + dx * 0.4, sy0 = q.a.y + dy * 0.4;
        b.x = sx + (q.gx + dx + 0.5 - sx) * ee; b.y = sy0 + (top + dy - sy0) * ee + Math.sin(Math.PI * e) * 1.5; b.z = q.a.z + (1.35 - q.a.z) * ee + Math.sin(Math.PI * e) * 2.5;
        b.s = 0.35 + 0.55 * ee; b.ry = (1 - ee) * 4; });

  }

    b.flash = Math.max(0, b.flash - dt * 3.2);

        b.s = b.s0 + (b.s1 - b.s0) * ee; b.rx += dt * 5; b.ry += dt * 4;

        if (e >= 1) {

          else if (b.end === 'withdraw') { b.dead = true; const R = REGS[b.reg]; if (R) { R.open = 1; emit(b.x, b.y, b.z, R.col, 6, 2); } }
          else { b.dead = true; emit(b.x, b.y, b.z, b.col, 14, 4); if (b.tgt && !b.tgt.gone) { b.tgt.hl = Math.max(b.tgt.hl, 0.7); b.tgt.pulse = Math.min(1.5, b.tgt.pulse + 0.35); } }
        }

      }

        const r = b.row; if (!r || r.gone || r.cleared) { if (r) absorb(r, b); else b.dead = true; break; }
        b.s = 0.8; b.vy -= 70 * dt; b.y += b.vy * dt;

        break;
      }
      case 'merge': {

        const e = Math.min(1, b.t), ee = 1 - (1 - e) * (1 - e);
        b.y = b.sy + (r.yd - b.sy) * ee; b.z = b.sz * (1 - ee); b.s = 0.9 * (1 - 0.6 * ee);

      }

      case 'shot': {

        if (e >= 1) { b.dead = true; emit(b.x, b.y, 0.4, b.col, 14, 4); if (r) { r.hl = Math.max(r.hl, 0.7); r.pulse = Math.min(1.5, r.pulse + 0.35); } }

    }
  }

  // particles, dust

  for (let i = 0; i < PN; i++) {
    if (pLife[i] <= 0) { if (pCol[i * 3] || pCol[i * 3 + 1] || pCol[i * 3 + 2]) pCol[i * 3] = pCol[i * 3 + 1] = pCol[i * 3 + 2] = 0; continue; }

  for (let i = 0; i < SN; i++) { sPos[i * 3 + 1] += sSpd[i] * dt; if (sPos[i * 3 + 1] > 30) sPos[i * 3 + 1] = -30; }

  // HUD
  if ((shownT -= dt) <= 0) { shownT = 0.5; const v = Math.round(p * 10 ** A.dec);   // in the coin's own decimals
    if (v !== lastPx) { const el = $('px'); el.textContent = fmtP(p); el.className = v > lastPx ? 'u' : 'd'; if (lastPx) { tagDir = v > lastPx ? 1 : -1; tagFlash = 1; } lastPx = v; shown = p; } }

  if ($('chg').textContent !== chg) $('chg').textContent = chg;
  $('s-clr').textContent = nCleared; $('s-eat').textContent = eaten ? fmtUsd(eaten).replace(' mln', 'M').replace(' mld', 'B') : '$0';
  $('s-liq').textContent = liqTot ? fmtUsd(liqTot).replace(' mln', 'M').replace(' mld', 'B') : '$0'; $('s-cmb').textContent = '×' + (T - lastClearT < 4.5 ? combo : 0);
  if ((tm.dist -= dt) <= 0) { tm.dist = 1; for (const r of liveRows()) drawLabel(r);
    checkNear(); drawSide();
    const now = Date.now(); trail.push({ t: now, p: pS }); while (trail.length && (trail.length > TRN || now - trail[0].t > 900e3)) trail.shift(); }

}

function render(rdt) {
  const t = clock, sy = yOf(pS);
  slab.position.y += (sy - slab.position.y) * Math.min(1, rdt * 6);
  sweep.position.x = -0.2 + ((t * 9) % 14.4);
  slabEdge.material.color.lerp(tmpC.set(tagDir > 0 ? UPC : tagDir < 0 ? DNC : NTC), Math.min(1, rdt * 4));
  slabEdge.material.opacity = 0.8 + 0.2 * Math.sin(t * 6);

  const scanY = 15 * RS - ((t * 5 * RS) % (34 * RS));
  { const now = Date.now(), lim = 13.4 * RS, tc = new THREE.Color(0x7ff0d0);
    for (let i = 0; i < TRN; i++) {
      const e = trail[i], j = i * 3;

      const age = (now - e.t) / 900e3, f = 0.3 + 0.9 * (1 - age) ** 2;
      trPos[j] = 13.4 - age * 13.4; trPos[j + 1] = Math.max(-lim, Math.min(lim, yOf(e.p))); trPos[j + 2] = -0.5;
      trCol[j] = tc.r * f; trCol[j + 1] = tc.g * f; trCol[j + 2] = tc.b * f;
    }
    trGeo.attributes.position.needsUpdate = true; trGeo.attributes.color.needsUpdate = true; }
  beam.position.y = scanY;
  for (const k in REGS) { const R = REGS[k];
    R.open = Math.max(0, R.open - rdt * 1.4); R.flash = Math.max(0, R.flash - rdt);
    R.drawer.position.x = -1.38 - R.open * 0.55; R.glow.material.opacity = R.open * 0.9;
    const ky = Math.min(1, rdt * 4); R.g.position.y += (tileTop - R.g.userData.i * tileStep - R.g.position.y) * ky; R.g.position.x += (tileX() - R.g.position.x) * ky;
    R.g.scale.setScalar(R.g.scale.x + (tileSc - R.g.scale.x) * ky);
    R.edge.material.opacity = selEx === k ? 0.8 + 0.2 * Math.sin(t * 6) : (R.on ? 0.3 : 0.12) + 0.6 * R.open + 0.06 * Math.sin(t * 2 + R.seed);
    if (selEx === k) R.glow.material.opacity = Math.max(R.glow.material.opacity, 0.5);
    drawReg(R); }

  if (!paused) updateNet(rdt, t);

  // rows: halos, labels, size tags, gates
  for (const r of rows) {
    const y = r.yd ?? r.y;
    const exS = !selEx ? -1 : selEx === 'model' ? (r.t.u === 'score' || r.type.endsWith('liq') ? 1 : 0)
      : r.per ? (r.per[selEx] || 0) / (Object.values(r.per).reduce((a, b) => a + b, 0) || 1) : 0;
    const dim = exS === 0 ? 0.22 : 1;
    if (r.warnT > 0) r.warnT -= rdt;
    const wb = r.warnT > 0 ? Math.abs(Math.sin(t * 9)) : 0;
    const fade = (r.gone ? Math.max(0, r.goneT / 0.9) : 1) * dim, fadeL = r.gone ? Math.max(0, (r.goneT - 0.55) / 0.35) : 1;
    if (r.bar) {
      r.thS += (thOf(r.units) - r.thS) * Math.min(1, rdt * 8);
      r.pulse = Math.max(0, r.pulse - rdt * 2.5);
      const th = Math.max(0.001, r.thS * (1 + 0.12 * r.pulse)), fl = r.flare > 0;
      r.bar.position.set(5 + (fl ? rnd(-0.04, 0.04) : 0), y, fl ? rnd(-0.06, 0.06) : 0); r.bar.scale.set(10, th, th);
      r.edge.position.copy(r.bar.position); r.edge.scale.copy(r.bar.scale);
      let br = 1 + 0.6 * Math.exp(-((y - scanY) ** 2) * 1.4) + 0.5 * r.pulse + 0.35 * r.hl + (exS > 0 ? 0.3 + exS : 0) + 0.9 * wb + (Math.abs(y - sy) < 1.2 * RS ? 0.2 : 0) + (fl ? 0.6 * Math.abs(Math.sin(t * 26)) : 0);
      if (r.glass) br *= 0.75 + 0.35 * Math.abs(Math.sin(t * 7 + y));

      m.opacity = (add ? 0.45 : 1) * fade;

    r.hl += ((r === selRow ? 1 : 0) - r.hl) * Math.min(1, rdt * 4);
    r.halo.scale.set(Math.max(1.5, r.endX + 1.6), 1.7 + near * 0.6, 1);

    r.halo.material.opacity = fade * (r.cleared ? 0.03 : 0.16 + 0.07 * Math.sin(t * 2.2 + y * 0.7) + near * 0.22 + r.hl * 0.45 + 0.7 * wb + (r.flare > 0 ? 0.35 * Math.abs(Math.sin(t * 22)) : 0));
    const lo = (r.gone ? fadeL : T - r.born < 0.35 ? 0 : r.cleared ? 0.3 : 1) * (exS === 0 ? 0.35 : 1);

    if (r && Math.abs(r.yd - sy) < 1.2 * RS) br += 0.25;

    if (glass && gl < 300) { glMesh.setMatrixAt(gl, dummy.matrix); glMesh.setColorAt(gl, tmpC); gl++; continue; }
    bMesh.setMatrixAt(n, dummy.matrix); bMesh.setColorAt(n, tmpC); n++;
  }
  glMesh.count = gl; glMesh.instanceMatrix.needsUpdate = true; glMesh.instanceColor.needsUpdate = true;
  bMesh.count = n; bMesh.instanceMatrix.needsUpdate = true; bMesh.instanceColor.needsUpdate = true;
  // ghosts: where the falling piece will land
  let gn = 0;
  for (const q of pieces) for (let j = 0; j < q.cells.length && gn < 64; j++) {
    dummy.position.set(q.gx + q.cells[j][0] + 0.5, q.row.yd + q.row.thS / 2 + 0.45 + q.cells[j][1], 0); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(0.9); dummy.updateMatrix();
    gMesh.setMatrixAt(gn, dummy.matrix); tmpC.copy(q.row.t.col).multiplyScalar(0.55 + 0.3 * Math.sin(t * 10)); gMesh.setColorAt(gn, tmpC); gn++;

  if (!down) { dragYaw *= Math.exp(-rdt * 0.35); dragPitch *= Math.exp(-rdt * 0.35); }
  const amp = RM ? 0.04 : 1;

  if (zoom <= 1.05) panY *= Math.exp(-rdt * 3);

}
requestAnimationFrame(frame);
if (/^https?:$/.test(location.protocol)) selectCoin(coinKey); else startDemo();
})();
