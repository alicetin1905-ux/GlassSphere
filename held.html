(() => {

const A = { name: 'BTC', file: 'glasssphere-data.json', okx: 'BTC-USDT-SWAP', okxCt: 0.01, usdt: 'BTCUSDT', gate: 'BTC_USDT', gateMul: 1e-4, gateIv: '10',
  htx: 'BTC-USDT', htxCt: 0.001, deribit: 'BTC-PERPETUAL', deribitUsd: true, bitmex: 'XBTUSD', cdc: 'BTCUSD-PERP', hl: 'BTC', hlSig: 3, dydx: 'BTC-USD',
  bin: 10, histBin: 100, buckets: [25, 50, 100, 250, 500], auto: { 0.015: 50, 0.03: 100, 0.06: 250, 0.12: 500 }, dec: 0 };
const digits = step => Math.max(0, -Math.floor(Math.log10(step))) + 3;
const nice = x => { const m = 10 ** Math.floor(Math.log10(x));
  return [1, 2, 2.5, 5, 10].map(c => c * m).reduce((a, b) => Math.abs(Math.log(x / b)) < Math.abs(Math.log(x / a)) ? b : a); };
const LEV = [[5, .30], [10, .35], [25, .25], [50, .10]];
const MAINT = 0.004, HALF_LIFE_H = 168, HZ_MIN = 0.3, HORIZON = 3;
const fx = (x, d) => x.toFixed(d).replace('.', ',');
const fmtP = p => p.toLocaleString('nl-NL', { minimumFractionDigits: A.dec, maximumFractionDigits: A.dec });
const fmtUsd = v => v >= 1e9 ? '$' + fx(v / 1e9, 2) + ' mld' : v >= 1e6 ? '$' + fx(v / 1e6, 1) + ' mln' : v >= 1e3 ? '$' + fx(v / 1e3, 0) + 'K' : '$' + fx(v, 0);
const pct = (p, ref) => { const v = (p / ref - 1) * 100; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ',') + '%'; };

async function getJSON(url, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { ...opts, signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const hlPost = body => getJSON('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
function binLevels(rows, side) {
  const m = {}, B = A.bin;
  for (const [p, usd] of rows) {

    const k = +((side === 'b' ? Math.floor(p / B + 1e-9) : Math.ceil(p / B - 1e-9)) * B).toFixed(digits(B));
    m[k] = (m[k] || 0) + usd;
  }
  return Object.entries(m).map(([k, v]) => [+k, Math.round(v)]);
}
const BOOKS = {

    const f = r => [+r.px, +r.sz * +r.px]; return { b: j.levels[0].map(f), a: j.levels[1].map(f) }; },
  bybit: async () => { const r = (await getJSON(`https://api.bybit.com/v5/market/orderbook?category=linear&symbol=${A.usdt}&limit=500`)).result;
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: r.b.map(f), a: r.a.map(f) }; },
  bitget: async () => { const d = (await getJSON(`https://api.bitget.com/api/v2/mix/market/merge-depth?productType=usdt-futures&symbol=${A.usdt}&limit=max&precision=scale2`)).data;
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: d.bids.map(f), a: d.asks.map(f) }; },
  htx: async () => { const t = (await getJSON(`https://api.hbdm.com/linear-swap-ex/market/depth?contract_code=${A.htx}&type=step0`)).tick;
    const f = x => [x[0], x[1] * A.htxCt * x[0]]; return { b: t.bids.map(f), a: t.asks.map(f) }; },
  bitmex: async () => { const j = await getJSON(`https://www.bitmex.com/api/v1/orderBook/L2?symbol=${A.bitmex}&depth=0`);
    const f = x => [x.price, x.size]; return { b: j.filter(x => x.side === 'Buy').map(f), a: j.filter(x => x.side === 'Sell').map(f) }; },
  cryptocom: async () => { const d = (await getJSON(`https://api.crypto.com/exchange/v1/public/get-book?instrument_name=${A.cdc}&depth=150`)).result.data[0];
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: d.bids.map(f), a: d.asks.map(f) }; },
  dydx: async () => { const j = await getJSON(`https://indexer.dydx.trade/v4/orderbooks/perpetualMarket/${A.dydx}`);
    const f = x => [+x.price, +x.size * +x.price]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
};
const MARKET = {
  okx: async () => { const [o, t] = await Promise.all([getJSON(`https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=${A.okx}`),
      getJSON(`https://www.okx.com/api/v5/market/ticker?instId=${A.okx}`)]);
    return { oi: +o.data[0].oiUsd, vol: +t.data[0].volCcy24h * +t.data[0].last }; },
  gate: async () => { const [t] = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/tickers?contract=${A.gate}`);
    return { oi: +t.total_size * A.gateMul * +t.mark_price, vol: +t.volume_24h_quote }; },
  bitget: async () => { const t = (await getJSON(`https://api.bitget.com/api/v2/mix/market/ticker?symbol=${A.usdt}&productType=usdt-futures`)).data[0];
    return { oi: +t.holdingAmount * +t.lastPr, vol: +t.usdtVolume }; },
  htx: async () => ({ vol: +(await getJSON(`https://api.hbdm.com/linear-swap-ex/market/detail/merged?contract_code=${A.htx}`)).tick.trade_turnover }),
  deribit: async () => { const r = (await getJSON(`https://www.deribit.com/api/v2/public/get_book_summary_by_instrument?instrument_name=${A.deribit}`)).result[0];
    return { oi: A.deribitUsd ? r.open_interest : r.open_interest * r.mark_price, vol: r.volume_usd }; },
  cryptocom: async () => { const t = (await getJSON(`https://api.crypto.com/exchange/v1/public/get-tickers?instrument_name=${A.cdc}`)).result.data[0];
    return { oi: +t.oi * +t.a, vol: +t.vv }; },
  hyperliquid: async () => { const [m, c] = await hlPost({ type: 'metaAndAssetCtxs' });
    const x = c[m.universe.findIndex(u => u.name === A.hl)]; return { oi: +x.openInterest * +x.markPx, vol: +x.dayNtlVlm }; },
  dydx: async () => { const x = (await getJSON(`https://indexer.dydx.trade/v4/perpetualMarkets?ticker=${A.dydx}`)).markets[A.dydx];
    return { oi: +x.openInterest * +x.oraclePrice, vol: +x.volume24H }; },
  binance: async () => { const [o, t, f] = await Promise.all([getJSON(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${A.usdt}`),
      getJSON(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${A.usdt}`), getJSON(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${A.usdt}`)]);
    return { oi: +o.openInterest * +f.markPrice, vol: +t.quoteVolume }; },
  bybit: async () => { const t = (await getJSON(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${A.usdt}`)).result.list[0];
    return { oi: +t.openInterestValue, vol: +t.turnover24h }; },
  bitmex: async () => { const [x] = await getJSON(`https://www.bitmex.com/api/v1/instrument?symbol=${A.bitmex}`); return { oi: x.openInterest, vol: x.foreignNotional24h || 0 }; },
};
async function fetchAll(table, wrap) {
  const out = {};
  await Promise.all(Object.entries(table).map(async ([k, fn]) => { try { out[k] = wrap(await fn(), k); } catch (e) {} }));
  return out;
}
const fetchBooks = () => fetchAll(BOOKS, r => ({ b: binLevels(r.b, 'b'), a: binLevels(r.a, 'a') }));
const fetchMarket = () => fetchAll(MARKET, r => r);
async function fetchSeries() {
  const base = 'https://www.okx.com/api/v5/market/', toC = r => [+r[0], +r[1], +r[2], +r[3], +r[4], +r[7]];
  const rows = (await getJSON(base + `candles?instId=${A.okx}&bar=1H&limit=300`)).data;
  try { rows.push(...(await getJSON(base + `history-candles?instId=${A.okx}&bar=1H&limit=100&after=${rows[rows.length - 1][0]}`)).data); } catch (e) {}
  const candles = rows.map(toC).sort((a, b) => a[0] - b[0]).slice(-400);
  const st = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=${A.gate}&interval=1h&from=${candles[0][0] / 1000}&limit=1000`);
  return { candles, oi: st.map(r => [r.time * 1000, Math.round(r.open_interest_usd)]), taker: st.map(r => [r.time * 1000, r.lsr_taker / (1 + r.lsr_taker)]) };
}
// Stops: just beyond swing highs / lows that price has not traded through since.
function estimateStops(candles, price, lo, hi) {
  const out = [], n = candles.length, now = candles[n - 1][0];
  const sufHi = new Float64Array(n + 1).fill(-Infinity), sufLo = new Float64Array(n + 1).fill(Infinity);
  for (let i = n - 1; i >= 0; i--) { sufHi[i] = Math.max(sufHi[i + 1], candles[i][2]); sufLo[i] = Math.min(sufLo[i + 1], candles[i][3]); }
  for (const [L, mult] of [[4, 1], [12, 2]]) {
    for (let i = L; i < n - L; i++) {
      const h = candles[i][2], l = candles[i][3];
      let isH = true, isL = true;
      for (let k = i - L; k <= i + L; k++) { if (k === i) continue; if (candles[k][2] >= h) isH = false; if (candles[k][3] <= l) isL = false; }
      if (!isH && !isL) continue;
      const rec = Math.pow(0.5, (now - candles[i][0]) / 3.6e6 / HALF_LIFE_H);
      let vol = 0; for (let k = Math.max(0, i - 2); k <= Math.min(n - 1, i + 2); k++) vol += candles[k][5];
      const w = vol * rec * mult;
      if (isH && !(sufHi[i + 1] > h)) out.push({ p: h * 1.001, side: 'buy', w });
      if (isL && !(sufLo[i + 1] < l)) out.push({ p: l * 0.999, side: 'sell', w });
    }
  }
  const ws = out.map(o => o.w).sort((a, b) => a - b), med = ws.length ? ws[ws.length >> 1] : 1;
  const rs = nice(price * 0.012);
  for (let i = Math.ceil(lo / rs); i * rs <= hi; i++) {
    const p = i * rs; out.push({ p: p > price ? p + rs * 0.05 : p - rs * 0.05, side: p > price ? 'buy' : 'sell', w: med * 0.25 });
  }
  return out.filter(o => (o.side === 'buy') === (o.p > price));
}
// Liquidations: OI added each hour at that hour's average price, split long/short, at the leverage mix that fit best.
function estimateLiqs(candles, oi, taker) {
  const oiAt = new Map(oi), tkAt = new Map(taker || []); let pos = [];
  candles.forEach(([t, o, h, l, c]) => {
    pos = pos.filter(q => q.side === 'long' ? l > q.p : h < q.p);
    const a = oiAt.get(t), b = oiAt.get(t + 3.6e6), d = a != null && b != null ? b - a : null;
    if (d != null && d < 0) { const r = b / a; pos.forEach(q => q.usd *= r); }
    else if (d != null) {
      let share = h > l ? (c - l) / (h - l) : 0.5;
      const tk = tkAt.get(t); if (tk != null) share = 0.5 * share + 0.5 * tk;
      const entry = (o + h + l + c) / 4;
      for (const [L, w] of LEV) {
        pos.push({ p: entry * (1 - 1 / L + MAINT), side: 'long', usd: d * share * w });
        pos.push({ p: entry * (1 + 1 / L - MAINT), side: 'short', usd: d * (1 - share) * w });
      }
    }
  });
  return pos;
}
function volumeWeights(books, market, P) {
  const depth = {};
  for (const [ex, bk] of Object.entries(books)) {
    let s = 0; for (const [p, v] of bk.b) if (p >= P * 0.99) s += v; for (const [p, v] of bk.a) if (p <= P * 1.01) s += v; depth[ex] = s;
  }
  const has = Object.keys(depth).filter(e => market[e]?.vol > 0);
  const dT = has.reduce((s, e) => s + depth[e], 0), vT = has.reduce((s, e) => s + market[e].vol, 0);
  const w = {};
  for (const e of Object.keys(depth)) w[e] = has.includes(e) && dT && vT && depth[e] ? Math.min(1, (market[e].vol / vT) / (depth[e] / dT)) : 1;
  return w;
}
function histEntry(books, weights, P, ts) {
  const m = new Map(), HB = A.histBin;
  for (const [ex, bk] of Object.entries(books)) {
    const w = weights[ex] ?? 1;
    [['b', 0], ['a', 1]].forEach(([side, i]) => { for (const [p, v] of bk[side]) {
      if (p < P * 0.94 || p > P * 1.06) continue;
      const k = +(Math.floor(p / HB + 1e-9) * HB).toFixed(digits(HB)), o = m.get(k) || [0, 0]; o[i] += v * w; m.set(k, o); } });
  }
  return { t: Math.floor(ts / 3.6e6) * 3.6e6, b: [...m].sort((x, y) => x[0] - y[0]).map(([k, [b, a]]) => [k, Math.round(b), Math.round(a)]) };
}
const READ = { range: 0.15 };
function poolsOf(stops, liqs, P) {
  const B = nice(P * 0.0012), lo = P * (1 - READ.range), hi = P * (1 + READ.range), bins = new Map();
  const add = (p, kind, v) => { if (p < lo || p > hi) return; const k = Math.floor(p / B + 1e-9) * B;
    const o = bins.get(k) || { stop: 0, liq: 0 }; o[kind] += v; bins.set(k, o); };
  stops.forEach(s => add(s.p, 'stop', s.w)); liqs.forEach(q => add(q.p, 'liq', q.usd));
  let mS = 1e-9, mL = 1e-9; for (const o of bins.values()) { if (o.stop > mS) mS = o.stop; if (o.liq > mL) mL = o.liq; }
  return [...bins].map(([k, o]) => ({ p: k + B / 2, stop: o.stop / mS, liq: o.liq / mL, liqUsd: o.liq, v: o.stop / mS + o.liq / mL }));
}
function targetsOf(cs, pools, P, days) {
  const n = cs.length, ranges = [];
  for (let e = n; e >= 24 && ranges.length < 14; e -= 24) { let h = -Infinity, l = Infinity;
    for (let k = e - 24; k < e; k++) { if (cs[k][2] > h) h = cs[k][2]; if (cs[k][3] < l) l = cs[k][3]; } ranges.push(h - l); }
  const range24 = ranges.reduce((s, x) => s + x, 0) / ranges.length;
  const rH = range24 * Math.sqrt(days), minD = HZ_MIN * rH;
  const best = arr => arr.length ? arr.reduce((x, y) => y.v > x.v ? y : x) : undefined;
  const tUp = best(pools.filter(q => q.p - P > minD && q.p - P <= rH));
  const tDn = best(pools.filter(q => P - q.p > minD && P - q.p <= rH));
  return { range24, rH, minD, tUp, tDn, pUp: tUp && tDn ? (P - tDn.p) / (tUp.p - tDn.p) : null };
}

// D: the data as the coin page holds it; LV: the levels of its "Alle niveaus" table; TG: its two targets
let D = null, LV = [], TG = null, nBooks = 0, mode = '', updAt = 0, liveHist = [], exKey = '', exKeyPrev = '';
function setData(raw, how) {
  const price = raw.price, lo = price * 0.85, hi = price * 1.15, market = raw.market || {};
  const weights = volumeWeights(raw.books, market, price);
  const gateOi = raw.oi?.length ? raw.oi[raw.oi.length - 1][1] : 0, total = Object.values(market).reduce((s, m) => s + (m.oi || 0), 0);
  const scale = gateOi && total > gateOi ? total / gateOi : 1;
  const liqs = estimateLiqs(raw.candles, raw.oi || [], raw.taker).map(q => ({ ...q, usd: q.usd * scale }));
  // the book history: the hourly file's, the hours seen live since, and now
  const hist = new Map((raw.bookHist || []).map(e => [e.t, e])); for (const e of liveHist) hist.set(e.t, e);
  const cur = histEntry(raw.books, weights, price, raw.ts); hist.set(cur.t, cur);
  if (how === 'live') liveHist = [...liveHist.filter(x => x.t !== cur.t), cur].slice(-48);
  D = { ...raw, market, weights, stops: estimateStops(raw.candles, price, lo, hi), liqs, bookHist: [...hist.values()].sort((a, b) => a.t - b.t).slice(-48) };

    if (age < .7) { hg.fillStyle = rgba(c, .5 * (1 - age / .7)); hg.fillRect(xx - 10, ry - 18, 20, 26); }
  }
  for (const m of [MAG.up, MAG.dn]) if (m.p != null) { const xx = Pk(m.p); hg.fillStyle = m.up ? CSS.up : CSS.dn; hg.save(); hg.translate(xx, ry + 4); hg.rotate(Math.PI / 4); hg.fillRect(-3, -3, 6, 6); hg.restore(); }
  hg.restore();
  const moodC = lerpHex(CSS.dn, CSS.up, (H.mood + 1) / 2), px = Math.max(gx + 16, Math.min(LW - gx - 16, Pk(P)));
  hg.fillStyle = moodC; hg.fillRect(px - .5, ry - 16, 1, 26);
  hg.font = `600 9.5px ${FM}`; const lw = hg.measureText(fmtP(P)).width + 12;
  hg.beginPath(); hg.roundRect(px - lw / 2, ry + 10, lw, 15, 2); hg.fill(); txt(fmtP(P), px, ry + 21, `600 9.5px ${FM}`, '#05080a', 'center');
  // the price of every 5th or 10th step, on the side of the stairs
  const every = STEP * (camS / STEP > 160 ? 50 : camS / STEP > 50 ? 10 : 5);
  for (let q = Math.ceil((camC - camS * .7) / every) * every; q <= camC + camS * .7; q += every) {

    const sx = (tmpV.x * .5 + .5) * W / k, sy = (-tmpV.y * .5 + .5) * Hh / k; if (sy < ry + 20 || sy > foot - 50) continue;
    txt(fmtP(q), sx, sy, `500 8.5px ${FM}`, Math.round(q / STEP) % 10 === 0 ? 'rgba(143,214,255,.6)' : 'rgba(143,214,255,.32)', 'center');
  }
  // what happened lately, with the time
  const nLog = LH > 520 ? 8 : 4, ly = ry + 50, wide2 = LW > 760;
  if (LOG.length) { const n = Math.min(nLog, LOG.length), lwid = wide2 ? Math.min(LW * .55, 470) : 180;
    hg.fillStyle = 'rgba(5,8,10,.6)'; hg.fillRect(gx - 8, ly - 13, lwid, 22 + n * 15);
    txt('LAATSTE GEBEURTENISSEN', gx, ly, `600 8.5px ${FM}`, CSS.faint); }
  LOG.slice(0, nLog).forEach((e, i) => {
    const tm = new Date(e.at).toLocaleTimeString('nl-NL', { hour12: false }), y = ly + 18 + i * 15;
    hg.globalAlpha = 1 - i * .08; hg.fillStyle = CSS[e.col]; hg.fillRect(gx, y - 9, 2, 11);

    hg.fillStyle = 'rgba(8,12,14,.78)'; hg.fillRect(xo, y - 22, w, 38); hg.fillStyle = col; hg.fillRect(xo, y - 22, 3, 38);
    hg.save(); hg.font = `800 15px ${FD}`; hg.fillStyle = CSS.txt; hg.textAlign = 'left'; hg.textBaseline = 'alphabetic'; hg.letterSpacing = '1.2px'; hg.fillText(c.title, xo + 16, y - 4); hg.restore();
    txt(c.sub, xo + 16, y + 10, `500 10.5px ${FM}`, rgba(col, .95));

  const ago = Math.max(0, Math.round((Date.now() - updAt) / 1000));
  const sy = narrow ? top + 136 : LH - 30;
  txt(mode === 'live' ? `${nBooks} orderboeken · ververst ${ago} s geleden` : `uurdata van GlassSphere · ${nBooks} orderboeken`, LW - gx, sy, `500 9px ${FM}`, 'rgba(233,241,238,.45)', 'right');
  txt(narrow ? `${stats.walls} muren · ${stats.stops} stops · ${fmtUsd(stats.real)} echte liq.` : `sinds openen: ${stats.walls} muren · ${stats.stops} stops · ${fmtUsd(stats.liq)} liq. geschat · ${fmtUsd(stats.real)} echt · ${stats.targets} doelen`,
    LW - gx, sy + 14, `500 9px ${FM}`, 'rgba(233,241,238,.3)', 'right');
}

let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  acc += last ? (ts - last) / 1000 : 0; last = ts;
  if (acc < 1 / Q.fps - .004) return;                      // phones: at most 30 frames a second
  const dt = Math.min(.05, acc); acc = 0; now += dt;
  if (!D) return;

  // too slow for its frame rate: a step down in resolution, at the end without bloom
  Q.n++; Q.t += dt;
  if (Q.t >= 3) { const fps = Q.n / Q.t; Q.n = Q.t = 0;
    if (Q.wait > 0) Q.wait--; else if (fps < Q.fps * .8 && Q.i < QUAL.length - 1) { Q.i++; Q.wait = 2; resize(); } }
}
(async () => {
  resize(); live.start(); liqFeeds();

  else if (!site) { msg('GEEN DATA: BEURZEN EN ' + A.file.toUpperCase() + ' NIET BEREIKBAAR'); setInterval(async () => { if (await loadLive()) location.reload(); }, 30e3); }
  else setInterval(loadLive, 30e3);
  await (document.fonts ? document.fonts.ready : null);
  // labels drawn before the fonts arrived are drawn again
  for (const sp of labels.values()) { scene.remove(sp); dispose(sp); } labels.clear(); MAG.up.labelTxt = MAG.dn.labelTxt = '';
  if (D) onLevels();

})();
// a hidden tab: the stream and the frames rest; back again, the hero catches up with the price
document.addEventListener('visibilitychange', () => { last = 0; acc = 0; Q.n = Q.t = 0; Q.wait = 2; });
window.HELD = { overview() { overviewAt = now - .01; }, get D() { return D; }, get LV() { return LV; }, get TG() { return TG; }, H, queue, onPrice, live, realLiq, objs, onLevels, LOG, Q };
})();
