<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GlassSphere · Zee</title>
<meta name="theme-color" content="#03090e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap">
<style>
/* Zee: the order book as a sea. The live price is a boat on the surface; the book is the sea floor under it (many orders:
   a sandbank close to the surface, few: deep water), estimated stops are rocks with a buoy, estimated liquidations are
   whirlpools, the two targets are lighthouses on the horizon. Funding is the wind, aggressive buying or selling the
   current, the day's range the waves, real liquidations a splash and a storm. Tap the sea to take a sounding.
   Stand-alone like Held; the data part is copied from held.html, so it computes exactly what the coin page shows. */
:root{
  color-scheme: dark;
  --bg:#03090e; --line2:#21313a; --txt:#eef4f0; --dim:#8aa0a6; --faint:#4a5d63;
  --up:#35ffb4; --dn:#ff4f6d; --stop:#ffc35a; --liq:#ad8bff; --btc:#f7931a;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;outline:none}
#sea.hand{cursor:pointer}
#sea.grab{cursor:grabbing}
#msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;font:500 12px var(--mono);letter-spacing:.1em;color:var(--dim);padding:24px;pointer-events:none}
#msg[hidden]{display:none}
.tools{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:6px;
  max-width:calc(100vw - 28px);overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools a,.tools button{flex:none;font:600 11px var(--mono);color:var(--dim);text-decoration:none;border:1px solid var(--line2);border-radius:6px;padding:6px 10px;
  background:rgba(3,9,14,.74);cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tools a:hover,.tools button:hover{color:var(--txt)}
.tools button[aria-pressed="true"]{color:var(--txt);border-color:#4d6670}
.tools button[aria-pressed="false"] .dot{opacity:.3}
.tools a:focus-visible,.tools button:focus-visible,.panel button:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:0}
.panel{position:fixed;right:16px;bottom:58px;width:330px;max-height:min(64vh,560px);overflow:auto;background:rgba(4,12,18,.9);border:1px solid var(--line2);
  border-radius:10px;padding:14px 16px 14px;font-size:12px;line-height:1.5;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.panel[hidden]{display:none}
#log{left:max(14px,env(safe-area-inset-left,0px));right:auto;width:340px}
.panel .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--dim);font:500 20px var(--sans);cursor:pointer;padding:2px 6px;line-height:1}
.panel .x:hover{color:var(--txt)}
.k{font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.big{font:700 21px var(--mono);margin:2px 0 8px}
.big span{font-size:12px;font-weight:600;margin-left:6px}
.obj{border-left:3px solid;padding:4px 0 4px 10px;margin:0 0 10px}
.obj b{display:block;font:700 13px var(--sans)}
.obj span{font:500 11px var(--mono);color:var(--dim)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0 0 10px}
dt{color:var(--dim)}
dd{text-align:right;font:500 11.5px var(--mono)}
dd i{font-style:normal;color:var(--faint);margin-left:6px}
.bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.07);margin:2px 0 4px}
.bar span{display:block;height:100%}
.barl{display:flex;justify-content:space-between;font:500 10px var(--mono);color:var(--dim);margin-bottom:8px}
.note{color:var(--dim);font-size:11.5px}
.fine{color:var(--faint);font-size:10.5px;margin-top:8px}
.leg{list-style:none;display:grid;gap:7px;margin:8px 0 6px}
.leg li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.leg li i{width:12px;height:12px;border-radius:3px;margin-top:3px;display:block}
.leg b{font-weight:700}
#log ol{list-style:none;display:grid;gap:5px;margin-top:8px}
#log li{display:grid;grid-template-columns:62px 1fr;gap:8px;font:500 10.5px var(--mono);border-left:2px solid;padding-left:8px}
#log li time{color:var(--dim)}
#log li span{color:var(--dim);display:block}
#toast{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:58px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none}
#toast div{background:rgba(5,12,16,.88);border-left:3px solid;padding:7px 14px 8px 12px;border-radius:2px;animation:tin .28s ease-out;transition:opacity .4s}
#toast b{display:block;font:800 13px var(--sans);letter-spacing:.06em}
#toast span{font:500 10.5px var(--mono)}
@keyframes tin{from{opacity:0;transform:translateX(-18px)}}
@media (max-width:639px){
  .panel,#log{left:12px;right:12px;width:auto;bottom:54px;max-height:48vh}
  #toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 92px);right:14px}
  #toast div{padding:6px 12px 7px 10px}
  .long{display:none}
}
@media (prefers-reduced-motion:reduce){#toast div{animation:none}}
</style>

<body>
<canvas id="sea" tabindex="0" aria-label="Het orderboek van BTC als zee: de prijs is een boot, de muren zijn de zeebodem, stops zijn rotsen met een boei, liquidaties zijn draaikolken en de doelen zijn vuurtorens. Tik of klik op de zee om te peilen; slepen schuift, knijpen of scrollen zoomt."></canvas>
<div id="msg">ZEE LADEN…</div>
<div id="sat" style="position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px)"></div>
<div id="toast" aria-live="polite"></div>
<div class="panel" id="card" hidden role="dialog" aria-label="Peiling"></div>
<div class="panel" id="log" hidden role="log" aria-label="Scheepsjournaal"></div>
<div class="tools">
  <a href="./#btc">← <span class="long">GlassSphere</span></a>

  <button id="logb" type="button" aria-pressed="false">≡ Journaal</button>
  <button id="help" type="button" aria-pressed="false">? Uitleg</button>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const msg = t => { $('msg').hidden = !t; if (t) $('msg').textContent = t; };

/* =====================================================================================================================
   DATA: copied from held.html, which copies index.html (asset, fetching, estimates, levels and targets), BTC only for now
   ===================================================================================================================== */
const A = { name: 'BTC', file: 'glasssphere-data.json', okx: 'BTC-USDT-SWAP', okxCt: 0.01, usdt: 'BTCUSDT', gate: 'BTC_USDT', gateMul: 1e-4, gateIv: '10',
  htx: 'BTC-USDT', htxCt: 0.001, deribit: 'BTC-PERPETUAL', deribitUsd: true, bitmex: 'XBTUSD', cdc: 'BTCUSD-PERP', hl: 'BTC', hlSig: 3, dydx: 'BTC-USD',
  bin: 10, histBin: 100, buckets: [25, 50, 100, 250, 500], auto: { 0.015: 50, 0.03: 100, 0.06: 250, 0.12: 500 }, dec: 0 };
const digits = step => Math.max(0, -Math.floor(Math.log10(step))) + 3;
const nice = x => { const m = 10 ** Math.floor(Math.log10(x));
  return [1, 2, 2.5, 5, 10].map(c => c * m).reduce((a, b) => Math.abs(Math.log(x / b)) < Math.abs(Math.log(x / a)) ? b : a); };
const LEV = [[5, .30], [10, .35], [25, .25], [50, .10]];
const MAINT = 0.004, HALF_LIFE_H = 168, HZ_MIN = 0.3, HORIZON = 3;
const fx = (x, d) => x.toFixed(d).replace('.', ',');
const fmtP = p => p.toLocaleString('nl-NL', { minimumFractionDigits: A.dec, maximumFractionDigits: A.dec });
const fmtUsd = v => v >= 1e9 ? '$' + fx(v / 1e9, 2) + ' mld' : v >= 1e6 ? '$' + fx(v / 1e6, 1) + ' mln' : v >= 1e3 ? '$' + fx(v / 1e3, 0) + 'K' : '$' + fx(v, 0);
const pct = (p, ref) => { const v = (p / ref - 1) * 100; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2).replace('.', ',') + '%'; };

async function getJSON(url, opts = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(url, { ...opts, signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const hlPost = body => getJSON('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
function binLevels(rows, side) {
  const m = {}, B = A.bin;
  for (const [p, usd] of rows) {
    if (!(usd > 0)) continue;
    const k = +((side === 'b' ? Math.floor(p / B + 1e-9) : Math.ceil(p / B - 1e-9)) * B).toFixed(digits(B));
    m[k] = (m[k] || 0) + usd;
  }
  return Object.entries(m).map(([k, v]) => [+k, Math.round(v)]);
}
const BOOKS = {
  okx: async () => { const b = (await getJSON(`https://www.okx.com/api/v5/market/books-full?instId=${A.okx}&sz=5000`)).data[0];
    const f = r => [+r[0], +r[1] * A.okxCt * +r[0]]; return { b: b.bids.map(f), a: b.asks.map(f) }; },
  binance: async () => { const j = await getJSON(`https://fapi.binance.com/fapi/v1/depth?symbol=${A.usdt}&limit=1000`);
    const f = r => [+r[0], +r[1] * +r[0]]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  deribit: async () => { const j = (await getJSON(`https://www.deribit.com/api/v2/public/get_order_book?instrument_name=${A.deribit}&depth=10000`)).result;
    const f = A.deribitUsd ? r => r : r => [r[0], r[1] * r[0]]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  gate: async () => { const j = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/order_book?contract=${A.gate}&limit=300&interval=${A.gateIv}`);
    const f = r => [+r.p, r.s * A.gateMul * +r.p]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
  hyperliquid: async () => { const j = await hlPost({ type: 'l2Book', coin: A.hl, nSigFigs: A.hlSig });
    const f = r => [+r.px, +r.sz * +r.px]; return { b: j.levels[0].map(f), a: j.levels[1].map(f) }; },
  bybit: async () => { const r = (await getJSON(`https://api.bybit.com/v5/market/orderbook?category=linear&symbol=${A.usdt}&limit=500`)).result;
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: r.b.map(f), a: r.a.map(f) }; },
  bitget: async () => { const d = (await getJSON(`https://api.bitget.com/api/v2/mix/market/merge-depth?productType=usdt-futures&symbol=${A.usdt}&limit=max&precision=scale2`)).data;
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: d.bids.map(f), a: d.asks.map(f) }; },
  htx: async () => { const t = (await getJSON(`https://api.hbdm.com/linear-swap-ex/market/depth?contract_code=${A.htx}&type=step0`)).tick;
    const f = x => [x[0], x[1] * A.htxCt * x[0]]; return { b: t.bids.map(f), a: t.asks.map(f) }; },
  bitmex: async () => { const j = await getJSON(`https://www.bitmex.com/api/v1/orderBook/L2?symbol=${A.bitmex}&depth=0`);
    const f = x => [x.price, x.size]; return { b: j.filter(x => x.side === 'Buy').map(f), a: j.filter(x => x.side === 'Sell').map(f) }; },
  cryptocom: async () => { const d = (await getJSON(`https://api.crypto.com/exchange/v1/public/get-book?instrument_name=${A.cdc}&depth=150`)).result.data[0];
    const f = x => [+x[0], +x[1] * +x[0]]; return { b: d.bids.map(f), a: d.asks.map(f) }; },
  dydx: async () => { const j = await getJSON(`https://indexer.dydx.trade/v4/orderbooks/perpetualMarket/${A.dydx}`);
    const f = x => [+x.price, +x.size * +x.price]; return { b: j.bids.map(f), a: j.asks.map(f) }; },
};
const MARKET = {
  okx: async () => { const [o, t] = await Promise.all([getJSON(`https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=${A.okx}`),
      getJSON(`https://www.okx.com/api/v5/market/ticker?instId=${A.okx}`)]);
    return { oi: +o.data[0].oiUsd, vol: +t.data[0].volCcy24h * +t.data[0].last }; },
  gate: async () => { const [t] = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/tickers?contract=${A.gate}`);
    return { oi: +t.total_size * A.gateMul * +t.mark_price, vol: +t.volume_24h_quote }; },
  bitget: async () => { const t = (await getJSON(`https://api.bitget.com/api/v2/mix/market/ticker?symbol=${A.usdt}&productType=usdt-futures`)).data[0];
    return { oi: +t.holdingAmount * +t.lastPr, vol: +t.usdtVolume }; },
  htx: async () => ({ vol: +(await getJSON(`https://api.hbdm.com/linear-swap-ex/market/detail/merged?contract_code=${A.htx}`)).tick.trade_turnover }),
  deribit: async () => { const r = (await getJSON(`https://www.deribit.com/api/v2/public/get_book_summary_by_instrument?instrument_name=${A.deribit}`)).result[0];
    return { oi: A.deribitUsd ? r.open_interest : r.open_interest * r.mark_price, vol: r.volume_usd }; },
  cryptocom: async () => { const t = (await getJSON(`https://api.crypto.com/exchange/v1/public/get-tickers?instrument_name=${A.cdc}`)).result.data[0];
    return { oi: +t.oi * +t.a, vol: +t.vv }; },
  hyperliquid: async () => { const [m, c] = await hlPost({ type: 'metaAndAssetCtxs' });
    const x = c[m.universe.findIndex(u => u.name === A.hl)]; return { oi: +x.openInterest * +x.markPx, vol: +x.dayNtlVlm }; },
  dydx: async () => { const x = (await getJSON(`https://indexer.dydx.trade/v4/perpetualMarkets?ticker=${A.dydx}`)).markets[A.dydx];
    return { oi: +x.openInterest * +x.oraclePrice, vol: +x.volume24H }; },
  binance: async () => { const [o, t, f] = await Promise.all([getJSON(`https://fapi.binance.com/fapi/v1/openInterest?symbol=${A.usdt}`),
      getJSON(`https://fapi.binance.com/fapi/v1/ticker/24hr?symbol=${A.usdt}`), getJSON(`https://fapi.binance.com/fapi/v1/premiumIndex?symbol=${A.usdt}`)]);
    return { oi: +o.openInterest * +f.markPrice, vol: +t.quoteVolume }; },
  bybit: async () => { const t = (await getJSON(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${A.usdt}`)).result.list[0];
    return { oi: +t.openInterestValue, vol: +t.turnover24h }; },
  bitmex: async () => { const [x] = await getJSON(`https://www.bitmex.com/api/v1/instrument?symbol=${A.bitmex}`); return { oi: x.openInterest, vol: x.foreignNotional24h || 0 }; },
};
async function fetchAll(table, wrap) {
  const out = {};
  await Promise.all(Object.entries(table).map(async ([k, fn]) => { try { out[k] = wrap(await fn(), k); } catch (e) {} }));
  return out;
}
const fetchBooks = () => fetchAll(BOOKS, r => ({ b: binLevels(r.b, 'b'), a: binLevels(r.a, 'a') }));
const fetchMarket = () => fetchAll(MARKET, r => r);
async function fetchSeries() {
  const base = 'https://www.okx.com/api/v5/market/', toC = r => [+r[0], +r[1], +r[2], +r[3], +r[4], +r[7]];
  const rows = (await getJSON(base + `candles?instId=${A.okx}&bar=1H&limit=300`)).data;
  try { rows.push(...(await getJSON(base + `history-candles?instId=${A.okx}&bar=1H&limit=100&after=${rows[rows.length - 1][0]}`)).data); } catch (e) {}
  const candles = rows.map(toC).sort((a, b) => a[0] - b[0]).slice(-400);
  const st = await getJSON(`https://api.gateio.ws/api/v4/futures/usdt/contract_stats?contract=${A.gate}&interval=1h&from=${candles[0][0] / 1000}&limit=1000`);
  return { candles, oi: st.map(r => [r.time * 1000, Math.round(r.open_interest_usd)]), taker: st.map(r => [r.time * 1000, r.lsr_taker / (1 + r.lsr_taker)]) };
}
// Stops: just beyond swing highs / lows that price has not traded through since.
function estimateStops(candles, price, lo, hi) {
  const out = [], n = candles.length, now = candles[n - 1][0];
  const sufHi = new Float64Array(n + 1).fill(-Infinity), sufLo = new Float64Array(n + 1).fill(Infinity);
  for (let i = n - 1; i >= 0; i--) { sufHi[i] = Math.max(sufHi[i + 1], candles[i][2]); sufLo[i] = Math.min(sufLo[i + 1], candles[i][3]); }
  for (const [L, mult] of [[4, 1], [12, 2]]) {
    for (let i = L; i < n - L; i++) {
      const h = candles[i][2], l = candles[i][3];
      let isH = true, isL = true;
      for (let k = i - L; k <= i + L; k++) { if (k === i) continue; if (candles[k][2] >= h) isH = false; if (candles[k][3] <= l) isL = false; }
      if (!isH && !isL) continue;
      const rec = Math.pow(0.5, (now - candles[i][0]) / 3.6e6 / HALF_LIFE_H);
      let vol = 0; for (let k = Math.max(0, i - 2); k <= Math.min(n - 1, i + 2); k++) vol += candles[k][5];
      const w = vol * rec * mult;
      if (isH && !(sufHi[i + 1] > h)) out.push({ p: h * 1.001, side: 'buy', w });
      if (isL && !(sufLo[i + 1] < l)) out.push({ p: l * 0.999, side: 'sell', w });
    }
  }
  const ws = out.map(o => o.w).sort((a, b) => a - b), med = ws.length ? ws[ws.length >> 1] : 1;
  const rs = nice(price * 0.012);
  for (let i = Math.ceil(lo / rs); i * rs <= hi; i++) {
    const p = i * rs; out.push({ p: p > price ? p + rs * 0.05 : p - rs * 0.05, side: p > price ? 'buy' : 'sell', w: med * 0.25 });
  }
  return out.filter(o => (o.side === 'buy') === (o.p > price));
}
// Liquidations: OI added each hour at that hour's average price, split long/short, at the leverage mix that fit best.
function estimateLiqs(candles, oi, taker) {
  const oiAt = new Map(oi), tkAt = new Map(taker || []); let pos = [];
  candles.forEach(([t, o, h, l, c]) => {
    pos = pos.filter(q => q.side === 'long' ? l > q.p : h < q.p);
    const a = oiAt.get(t), b = oiAt.get(t + 3.6e6), d = a != null && b != null ? b - a : null;
    if (d != null && d < 0) { const r = b / a; pos.forEach(q => q.usd *= r); }
    else if (d != null) {
      let share = h > l ? (c - l) / (h - l) : 0.5;
      const tk = tkAt.get(t); if (tk != null) share = 0.5 * share + 0.5 * tk;
      const entry = (o + h + l + c) / 4;
      for (const [L, w] of LEV) {
        pos.push({ p: entry * (1 - 1 / L + MAINT), side: 'long', usd: d * share * w });
        pos.push({ p: entry * (1 + 1 / L - MAINT), side: 'short', usd: d * (1 - share) * w });
      }
    }
  });
  return pos;
}
function volumeWeights(books, market, P) {
  const depth = {};
  for (const [ex, bk] of Object.entries(books)) {
    let s = 0; for (const [p, v] of bk.b) if (p >= P * 0.99) s += v; for (const [p, v] of bk.a) if (p <= P * 1.01) s += v; depth[ex] = s;
  }
  const has = Object.keys(depth).filter(e => market[e]?.vol > 0);
  const dT = has.reduce((s, e) => s + depth[e], 0), vT = has.reduce((s, e) => s + market[e].vol, 0);
  const w = {};
  for (const e of Object.keys(depth)) w[e] = has.includes(e) && dT && vT && depth[e] ? Math.min(1, (market[e].vol / vT) / (depth[e] / dT)) : 1;
  return w;
}
function histEntry(books, weights, P, ts) {
  const m = new Map(), HB = A.histBin;
  for (const [ex, bk] of Object.entries(books)) {
    const w = weights[ex] ?? 1;

}

  acc += last ? (ts - last) / 1000 : 0; last = ts;
  if (acc < (phone ? 1 / 30 : 1 / 60) - .004) return;
  const dt = Math.min(.05, acc || .016); acc = 0;
  if (!D) return;
  T += dt; step(dt); draw(dt);
}
document.addEventListener('visibilitychange', () => { last = 0; acc = 0; });

/* ---- events from the data -------------------------------------------------------------------------------------------- */
function onLevels() {
  grid();
  const seen = {}; for (const L of LV) { const k = L.k + L.above; L.rank = seen[k] = (seen[k] ?? -1) + 1; }
  MINOR = [...minor(G.stB, 'stop', true), ...minor(G.stS, 'stop', false), ...minor(G.lqS, 'liq', true), ...minor(G.lqL, 'liq', false)];
  const cs = D.candles, n = cs.length;
  C24 = n > 25 ? cs[n - 25][4] : null;
  let hi = -Infinity, lo = Infinity; for (let k = Math.max(0, n - 24); k < n; k++) { hi = Math.max(hi, cs[k][2]); lo = Math.min(lo, cs[k][3]); } RANGE24 = hi - lo;
  if (!V.r) { V.c = D.price; V.r = defR() * 1.7; V.anim = { c0: V.c, r0: V.r, r1: defR(), t0: T, d: 1.6 }; }
  // a selected level keeps its selection across a refresh, by key, else the sounding stays at its price
  if (SEL?.obj && !SEL.obj.boat && !SEL.obj.port) SEL.obj = LV.find(L => L.key === SEL.obj.key) || null;
  msg(''); if (SEL && $('card').dataset.kind === 'sel') renderCard();
}
function onPrice(prev, p) {
  if (!D || !(prev > 0)) return;
  const lo = Math.min(prev, p), hi = Math.max(prev, p); if (hi <= lo) return;
  for (const L of LV) if (L.p > lo && L.p <= hi) cross(L, p > prev);
  for (const [tp, up] of [[TG?.up, true], [TG?.dn, false]]) if (tp > lo && tp <= hi && Date.now() - (CROSSED.get('port' + up) || 0) > 600e3) {
    CROSSED.set('port' + up, Date.now()); toast('VUURTOREN BEREIKT', `doel ${up ? 'boven' : 'onder'} · ${fmtP(tp)}`, up ? 'up' : 'dn'); }
}
function cross(L, rising) {
  const t = Date.now(); if (t - (CROSSED.get(L.key) || 0) < 120e3) return; CROSSED.set(L.key, t);
  const x = X(L.p), sub = `${nameOf(L.k, L.above)} · ${L.v} · ${fmtP(L.p)}`, big = L.rel >= .6;
  if (L.k === 'stop') { L.hit = T; if (!document.hidden) splash(x, .25 + L.rel * .4, 'stop'); (big ? toast : logEvent)('STOPS GERAAKT', sub, 'stop'); }
  else if (L.k === 'liq') { B0.spin = T; B0.spinDir = rising ? -1 : 1; (big ? toast : logEvent)('IN DE KOLK', sub, 'liq'); }
  else { if (!document.hidden) sandCloud(x, bedAt(x), L.rel); (big ? toast : logEvent)('DOOR DE ZANDBANK', sub, colOf(L)); }
}
// a real liquidation: gathered over 1.5 s per side, then a splash where it happened (as in Held)
const liqBurst = { long: null, short: null };
function realLiq(ex, long, p, usd) {
  if (!(usd > 0) || !(p > 0) || !D) return;
  const k = long ? 'long' : 'short', b = liqBurst[k] || (liqBurst[k] = { usd: 0, pw: 0, ex: new Set(), at: Date.now() });
  b.usd += usd; b.pw += p * usd; b.ex.add(ex);
  if (!b.timer) b.timer = setTimeout(() => { liqBurst[k] = null; showRealLiq(long, b.pw / b.usd, b.usd, [...b.ex], b.at); }, 1500);
}
function showRealLiq(long, p, usd, ex, at) {
  STATS.real += usd; RECENT.push({ t: Date.now(), usd }); while (RECENT.length && Date.now() - RECENT[0].t > 300e3) RECENT.shift();
  const big = clamp(Math.log10(Math.max(1, usd / 1e4)) / 2.5, 0, 1), x = X(p);
  if (!document.hidden && x > -40 && x < W + 40) splash(x, big, 'liq');
  storm = Math.min(1, storm + Math.min(.5, usd / 3e6));
  if (usd >= 1e6 && !reduced) { FLASH = 1; BOLT = { x: clamp(x, 20, W - 20), t0: T, seed: R() * 100 }; }
  // the estimated whirlpool close by flares: here it actually happens
  for (const L of LV) if (L.k === 'liq' && L.above === !long && Math.abs(L.p - p) <= D.B * 2) L.real = T;
  const sub = `${long ? 'Longs' : 'Shorts'} · ${fmtUsd(usd)} · ${ex.join(' + ')} · ${fmtP(p)}`;
  if (usd >= 250e3) toast('ECHTE LIQUIDATIE', sub, 'liq', at); else if (usd >= 50e3) logEvent('Echte liquidatie', sub, 'liq', at);
}

/* ---- journal and toasts ----------------------------------------------------------------------------------------------- */
const hhmmss = t => new Date(t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function logEvent(title, sub, col, at = Date.now()) {
  LOG.unshift({ title: title.charAt(0) + title.slice(1).toLowerCase(), sub, col, at }); LOG.length = Math.min(LOG.length, 60);
  if (!$('log').hidden) renderLog();
}
function toast(title, sub, col, at) {
  logEvent(title, sub, col, at);
  const box = $('toast'), el = document.createElement('div'); el.style.borderColor = CSS[col];
  el.innerHTML = `<b></b><span></span>`; el.firstChild.textContent = title; el.lastChild.textContent = sub; el.lastChild.style.color = CSS[col];
  box.appendChild(el); while (box.children.length > (phone ? 1 : 3)) box.firstChild.remove();
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 450); }, 4200);
}
function renderLog() {
  const items = LOG.map(e => `<li style="border-color:${CSS[e.col]}"><time>${hhmmss(e.at)}</time><div>${e.title}<span>${e.sub}</span></div></li>`).join('');
  $('log').innerHTML = `<button class="x" type="button" aria-label="Sluiten">×</button><div class="k">Scheepsjournaal</div>
    ${items ? `<ol>${items}</ol>` : `<p class="note" style="margin-top:8px">Nog niets gebeurd sinds je de zee opende. Hier komen echte liquidaties vanaf $50K, en de muren, stops en kolken die de prijs passeert.</p>`}`;
}

/* ---- the card: a sounding, a level, the boat, or the legend ---------------------------------------------------------- */
function objBlock(o) {
  const P = B0.p;
  if (o.port) return `<div class="obj" style="border-color:${o.up ? CSS.up : CSS.dn}"><b>Vuurtoren · doel ${o.up ? 'boven' : 'onder'}</b>
    <span>${o.prob != null ? `${o.prob}% kans dat dit doel eerst valt, binnen ${HORIZON} dagen` : 'geen kans berekend'}</span></div>`;
  const col = CSS[colOf(o)], what = { ask: 'Zandbank · verkoopmuur', bid: 'Zandbank · koopmuur', stop: `Rots · ${nameOf('stop', o.above).toLowerCase()}`, liq: `Kolk · ${o.above ? 'short-liquidaties' : 'long-liquidaties'}` }[o.k];
  const extra = isWall(o) ? (o.ps ? `aanwezig in ${o.ps[0]} van de laatste ${o.ps[1]} uur` : 'orders die op de prijs wachten') :
    o.k === 'stop' ? 'geschat: net voorbij een top of bodem die nog niet is doorbroken' : `geschat: posities die bij deze prijs gedwongen worden ${o.above ? 'gekocht' : 'verkocht'}`;
  return `<div class="obj" style="border-color:${col}"><b>${what} · ${o.v}</b><span>${extra}</span></div>`;
}
function renderCard() {
  const c = $('card'); c.dataset.kind = 'sel'; c.setAttribute('aria-label', 'Peiling');
  const o = SEL.obj, P = B0.p;
  if (o?.boat) {
    const tk = TAKER.now();
    c.innerHTML = `<button class="x" type="button" aria-label="Sluiten">×</button><div class="k">De boot · live prijs (OKX)</div>
      <div class="big" style="color:${CSS.btc}">${fmtP(P)}${C24 ? ` <span style="color:${P >= C24 ? CSS.up : CSS.dn}">${pct(P, C24)} 24u</span>` : ''}</div>
      <dl><dt>Koopdruk, 10 s</dt><dd>${tk.seen ? Math.round(tk.buy * 100) + '%' : '–'}</dd><dt>Funding (8 u)</dt><dd>${FUND == null ? '–' : fx(FUND * 100, 4) + '%'}</dd>
      <dt>24-uursbereik</dt><dd>${RANGE24 ? fmtP(RANGE24) + ' · ' + fx(RANGE24 / P * 100, 1) + '%' : '–'}</dd>
      <dt>Echte liq. sinds openen</dt><dd>${fmtUsd(STATS.real)}</dd></dl>
      <p class="note">De boeg wijst waar de prijs het laatst heen ging; het schuimspoor is de laatste 18 seconden. Tik op de zee om te peilen wat er tussen de boot en een prijs ligt.</p>`;
    return;
  }
  const q = SEL.p, s = sound(q), up = s.up, col = up ? CSS.up : CSS.dn;
  const word = s.e > .66 ? 'ondiep · een muur' : s.e > .33 ? 'middeldiep' : 'diep · vrij water';
  const tot = s.liq + s.walls, ls = tot ? s.liq / tot * 100 : 0, ratio = s.walls ? s.liq / s.walls : null;
  const note = !tot ? 'Tussen de boot en hier ligt niets: vrij water.' : ratio == null || ratio >= 1.5 ? 'Meer brandstof dan rem: de liquidaties onderweg kunnen een beweging hierheen versnellen.'
    : ratio <= .5 ? 'Meer rem dan brandstof: de muren onderweg houden een beweging hierheen eerder tegen.' : 'Brandstof en rem houden elkaar ongeveer in evenwicht.';
  c.innerHTML = `<button class="x" type="button" aria-label="Sluiten">×</button><div class="k">Peiling</div>
    <div class="big">${fmtP(q)} <span style="color:${col}">${pct(q, P)}</span></div>
    ${o ? objBlock(o) : ''}
    <dl><dt>Diepte hier</dt><dd>${word}</dd><dt>Orders hier</dt><dd>${fmtUsd(s.here)}<i>per $${D.B}</i></dd>
      <dt>Muren tot hier</dt><dd>${fmtUsd(s.walls)}<i>remt</i></dd><dt>Liquidaties tot hier</dt><dd>${fmtUsd(s.liq)}<i>duwt</i></dd>
      <dt>Stops tot hier</dt><dd>${Math.round(s.stShare * 100)}%<i>van de ${up ? 'koopstops erboven' : 'verkoopstops eronder'}</i></dd></dl>
    <div class="bar" role="img" aria-label="Liquidaties tegenover muren: ${Math.round(ls)}% tegen ${Math.round(100 - ls)}%"><span style="width:${ls}%;background:${CSS.liq}"></span><span style="width:${tot ? 100 - ls : 0}%;background:${col};opacity:.7"></span></div>
    <div class="barl"><span>brandstof ${Math.round(ls)}%</span><span>rem ${tot ? Math.round(100 - ls) : 0}%</span></div>
    <p class="note">${note}</p>
    <p class="fine">Muren: de orderboeken van ${nBooks} beurzen, gewogen naar hun volume. Stops en liquidaties zijn schattingen, net als op de coinpagina. Geen advies.</p>`;
}
function renderLegend() {
  const c = $('card'); c.dataset.kind = 'legend'; c.setAttribute('aria-label', 'Uitleg');
  const li = (col, b, t) => `<li><i style="background:${col}"></i><span><b>${b}</b> ${t}</span></li>`;
  c.innerHTML = `<button class="x" type="button" aria-label="Sluiten">×</button><div class="k">Uitleg · de zee</div>
    <ul class="leg">
      ${li(CSS.btc, 'De boot', 'is de live prijs. Het schuimspoor laat zien waar hij net vandaan komt.')}
      ${li(CSS.sand, 'De zeebodem', 'is het orderboek. Veel orders maken een zandbank vlak onder het water, daar loopt de prijs vast. Weinig orders betekent diep water, daar vaart hij vrij. Links (groen) liggen de koopmuren, rechts (rood) de verkoopmuren.')}
      ${li(CSS.stop, 'Rotsen en boeien', 'zijn geschatte stops. Een rode boei staat bij de verkoopstops onder de prijs, een groene bij de koopstops erboven. Hoe hoger de rots, hoe meer stops.')}
      ${li(CSS.liq, 'Draaikolken', 'zijn geschatte liquidaties. Ze trekken de prijs aan: als ze afgaan, duwen ze hem verder.')}
      ${li('#ffffff', 'Vuurtorens', 'zijn de twee doelen. De felste valt volgens het model eerst.')}
      ${li('#7fb0c4', 'Het weer', 'De wind is de funding, de stroming en de vissen volgen de koopdruk, de golven zijn het bereik van de dag. Echte liquidaties spatten op en maken storm.')}
    </ul>
    <p class="note">Tik of klik op de zee om te <b>peilen</b>: je ziet hoeveel muur (rem) en liquidatie (brandstof) tussen de boot en die prijs ligt. Slepen schuift, knijpen of scrollen zoomt, dubbeltikken of <b>⌖ Volg</b> brengt je terug naar de boot.</p>`;
}
function openCard(kind) {
  const c = $('card'); if (kind === 'legend') renderLegend(); else renderCard();
  c.hidden = false; $('help').setAttribute('aria-pressed', String(kind === 'legend'));
  if (phone && !$('log').hidden) setLog(false);
}
function closeCard() { $('card').hidden = true; $('help').setAttribute('aria-pressed', 'false'); if ($('card').dataset.kind === 'sel') SEL = null; }
const setLog = on => { $('log').hidden = !on; $('logb').setAttribute('aria-pressed', String(on)); if (on) { renderLog(); if (phone) $('card').hidden = true; } };
$('card').addEventListener('click', e => { if (e.target.closest('.x')) { closeCard(); cv.focus(); } });
$('log').addEventListener('click', e => { if (e.target.closest('.x')) setLog(false); });
$('logb').onclick = () => setLog($('log').hidden);
$('help').onclick = () => { if (!$('card').hidden && $('card').dataset.kind === 'legend') closeCard(); else openCard('legend'); };
$('follow').onclick = () => { if (D) home(); };
for (const b of document.querySelectorAll('[data-layer]')) {
  const k = b.dataset.layer; b.setAttribute('aria-pressed', String(LAYERS[k]));
  b.onclick = () => { LAYERS[k] = !LAYERS[k]; b.setAttribute('aria-pressed', String(LAYERS[k])); try { localStorage.setItem('zee-layers', JSON.stringify(LAYERS)); } catch (e) {} };
}
setInterval(() => { if (!$('card').hidden && $('card').dataset.kind === 'sel' && SEL) renderCard(); }, 2000);

/* ---- input: tap to sound or select, drag to pan, pinch or wheel to zoom --------------------------------------------- */
const ptrs = new Map(); let drag = null, pinch = null, lastTap = 0;
function pick(x, y) {
  let best = null, bd = Infinity;
  for (const h of HITS) { const d = Math.hypot((x - h.x) / h.rx, (y - h.y) / h.ry); if (d < 1 && d + h.pri * .01 < bd) { bd = d + h.pri * .01; best = h; } }
  return best?.obj || null;
}
function tap(x, y) {
  const now = performance.now(); if (now - lastTap < 300) { lastTap = 0; home(); return; } lastTap = now;
  const o = pick(x, y);
  if (o?.boat && o.edge) { home(); return; }
  if (y < HZ - 60 && !o) return;                             // the sky is not the sea
  SEL = { p: o ? (o.boat ? B0.p : o.p) : PX(x), obj: o, t0: T }; openCard('sel');
}
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) drag = { x0: e.clientX, y0: e.clientY, c: V.c, moved: false };
  else if (ptrs.size === 2 && D) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.max(20, Math.abs(a.x - b.x)), r: V.r, mid: (a.x + b.x) / 2 }; pinch.p = PX(pinch.mid); if (drag) drag.moved = true; }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse' && !ptrs.size) { HOVER = e.clientX > 0 && e.clientY > SURF - 20 ? e.clientX : null; const o = pick(e.clientX, e.clientY); HOVOBJ = o && LV.includes(o) ? o : null; cv.classList.toggle('hand', !!o); }
  if (!ptrs.has(e.pointerId) || !D) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()], d = Math.max(20, Math.abs(a.x - b.x)), mid = (a.x + b.x) / 2;
    V.r = clamp(pinch.r * pinch.d / d, rMin(), rMax()); V.c = pinch.p - (mid - W / 2) / (W / 2) * V.r; V.anim = null; return; }
  if (drag) { const dx = e.clientX - drag.x0; if (!drag.moved && Math.hypot(dx, e.clientY - drag.y0) > 7) { drag.moved = true; cv.classList.add('grab'); setFollow(false); V.anim = null; }
    if (drag.moved) V.c = drag.c - dx / (W / 2) * V.r; }
});
const up = e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!ptrs.size) { if (drag && !drag.moved && D) tap(e.clientX, e.clientY); drag = null; cv.classList.remove('grab'); }
  else if (drag) { const [p] = [...ptrs.values()]; drag = { x0: p.x, y0: p.y, c: V.c, moved: true }; }
};
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; drag = null; });
cv.addEventListener('pointerleave', () => { HOVER = null; HOVOBJ = null; });
cv.addEventListener('wheel', e => { if (!D) return; e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { V.c += e.deltaX / (W / 2) * V.r; setFollow(false); V.anim = null; }
  else zoomAt(V.r * Math.exp(e.deltaY * .0015), e.clientX); }, { passive: false });
cv.addEventListener('keydown', e => {
  if (!D) return; const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight') { V.c += (k === 'ArrowLeft' ? -1 : 1) * V.r * .15; setFollow(false); V.anim = null; }
  else if (k === '+' || k === '=') zoomAt(V.r / 1.25, W / 2); else if (k === '-' || k === '_') zoomAt(V.r * 1.25, W / 2);
  else if (k === '0') home(); else if (k === 'Escape') { closeCard(); setLog(false); }
  else if (k === 'Enter' || k === ' ') { SEL = { p: V.c, obj: null, t0: T }; openCard('sel'); }
  else return;
  e.preventDefault();
});

/* ---- start ------------------------------------------------------------------------------------------------------------ */
(async () => {
  resize(); live.start(); liqFeeds(); loadFunding(); setInterval(loadFunding, 5 * 60e3);
  requestAnimationFrame(frame);
  site = await loadSite(); if (site) setData(site, 'site');
  if (await loadLive()) setInterval(loadLive, 15e3);
  else if (!site) { msg('GEEN DATA: BEURZEN EN ' + A.file.toUpperCase() + ' NIET BEREIKBAAR'); setInterval(async () => { if (await loadLive()) location.reload(); }, 30e3); }
  else setInterval(loadLive, 30e3);
  let seen = false; try { seen = localStorage.getItem('zee-seen') === '1'; localStorage.setItem('zee-seen', '1'); } catch (e) {}
  if (!seen && D) openCard('legend');
})();
window.ZEE = { get D() { return D; }, get LV() { return LV; }, get TG() { return TG; }, get V() { return V; }, realLiq, showRealLiq, onPrice, cross, live, sound, B0, tap, LAYERS };
})();
</script>
